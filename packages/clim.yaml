################################################################################
# CLIMATISATION PANASONIC (Comfort Cloud) — chambre de Lolo
#
# Cette pièce n'a aucun radiateur : la clim y est l'unique source de chaleur.
# Elle fait deux choses :
#   - maintenir une température minimale (input_number.clim_temp_min, 15 °C),
#     mesurée sur la sonde d'ambiance Sonoff de la pièce ;
#   - assécher la chambre, SUR DEMANDE UNIQUEMENT : un bouton lance la clim
#     en mode chaud à 24 °C pendant 1 h ou 2 h, puis elle s'arrête seule. Le
#     mode chaud assèche mieux que `dry` sur cet appareil.
#
# Hors de cela, elle ne fait rien : le rafraîchissement et l'appoint
# chauffage existent mais sont des interrupteurs désactivés.
#
# Dès qu'une consigne de température est posée à la main depuis Home Assistant,
# l'automatisation s'efface et laisse la main, pour quelques heures.
#
# ATTENTION — Comfort Cloud est une API distante, lente et à quota. Toute
# commande superflue rapproche de la limite et peut faire tomber l'intégration
# en erreur. D'où les garde-fous : on n'envoie un ordre que s'il diffère de
# l'état courant, et jamais plus d'un toutes les 5 minutes par appareil.
################################################################################

################################################################################
# 1. COMMANDES
#
# Aucun `initial:`, ni ici ni sur les réglages numériques : un redémarrage ne
# doit pas écraser tes choix. Les valeurs de départ sont posées une seule
# fois par l'automatisation chauffage_initialiser_reglages (chauffage.yaml).
################################################################################
input_boolean:
  clim_assechement:
    name: "Clim - assécher la chambre"
    icon: mdi:water-off

  clim_auto_froid:
    name: "Clim - rafraîchissement (désactivé par défaut)"
    icon: mdi:snowflake

  clim_auto_chaud:
    name: "Clim - appoint chauffage (désactivé par défaut)"
    icon: mdi:heat-pump

  clim_maintien_temp_min:
    name: "Clim - maintenir une température minimale"
    icon: mdi:thermometer-chevron-down

  clim_pilotage_manuel:
    name: "Clim - pilotage manuel en cours"
    icon: mdi:hand-back-right

input_select:
  clim_duree_assechement:
    name: "Clim - durée de l'assèchement"
    icon: mdi:timer-outline
    options:
      - "1 h"
      - "2 h"

input_number:



  clim_temp_min:
    # La chambre de Lolo n'a pas de radiateur : cette valeur est la seule
    # chose qui empêche la pièce de suivre la température extérieure.
    name: "Clim - température minimale maintenue"
    icon: mdi:thermometer-chevron-down
    min: 5
    max: 20
    step: 0.5
    unit_of_measurement: "°C"

  clim_duree_manuel:
    name: "Clim - durée de la main laissée"
    icon: mdi:timer-sand
    min: 30
    max: 720
    step: 30
    unit_of_measurement: min

  clim_seuil_froid:
    name: "Clim - déclenchement du froid"
    icon: mdi:thermometer-high
    min: 22
    max: 32
    step: 0.5
    unit_of_measurement: "°C"

  clim_consigne_ete:
    name: "Clim - consigne d'été"
    icon: mdi:snowflake-thermometer
    min: 20
    max: 28
    step: 0.5
    unit_of_measurement: "°C"

  clim_seuil_pac:
    name: "Clim - extérieur mini pour l'appoint"
    icon: mdi:thermometer-low
    min: -10
    max: 15
    step: 1
    unit_of_measurement: "°C"

################################################################################
# 2. DÉCISION
#
# Priorité décroissante :
#   0. Assèchement demandé (bouton)               -> chaud, 24 °C
#   2. Rafraîchissement activé, occupant, trop chaud -> froid
#   3. Appoint activé et pièce confiée à la clim  -> chaud, consigne du moment
#   5. Sinon                                      -> arrêt
#
# L'assèchement passe par le mode CHAUD et non `dry` : sur cette Panasonic,
# le mode chaud fait tomber l'humidité relative bien plus efficacement.
# À noter qu'il l'abaisse en réchauffant l'air plutôt qu'en extrayant de
# l'eau — ce qui est précisément ce qui compte contre la condensation et les
# moisissures sur les parois froides.
################################################################################
template:
  - sensor:
      - name: "Clim pilotage"
        unique_id: clim_pilotage
        icon: mdi:air-conditioner
        state: >-
          {% if is_state('input_boolean.clim_pilotage_manuel', 'on') %}
            manuel
          {% else %}
            {% set o = state_attr('sensor.clim_pilotage', 'ordres') or {} %}
            {{ o.values() | rejectattr('mode', 'eq', 'off') | list | count }}
          {% endif %}
        attributes:
          ordres: >-
            {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
            {% set consignes = state_attr('sensor.chauffage_consignes', 'consignes') or {} %}
            {% set relais = state_attr('sensor.chauffage_relais', 'relais') or {} %}
            {% set temps = state_attr('sensor.chauffage_temperatures', 'temperatures') or {} %}
            {% set seuil_froid = states('input_number.clim_seuil_froid') | float(default=26) %}
            {% set consigne_ete = states('input_number.clim_consigne_ete') | float(default=25) %}
            {% set temp_min = states('input_number.clim_temp_min') | float(default=15) %}
            {% set froid_ok = is_state('input_boolean.clim_auto_froid', 'on') %}
            {% set chaud_ok = is_state('input_boolean.clim_auto_chaud', 'on') %}
            {% set temp_min_ok = is_state('input_boolean.clim_maintien_temp_min', 'on') %}
            {% set assecher = is_state('input_boolean.clim_assechement', 'on') %}
            {% set ns = namespace(presents=[]) %}
            {% for q in ['leo', 'pablo', 'laurent'] %}
              {% if is_state('input_boolean.presence_' ~ q, 'on') %}
                {% set ns.presents = ns.presents + [q] %}
              {% endif %}
            {% endfor %}
            {% set nd = namespace(d={}) %}
            {% for p, c in cfg.items() if c.clim %}
              {% set occupe = c.occupants | select('in', ns.presents) | list | count > 0 %}
              {% set mesure = temps.get(p) | float(default=20) %}
              {% set cible = consignes.get(p, 15) | float(default=15) %}
              {# L'assèchement, demandé explicitement, passe devant tout le
                 reste ; il chauffe à 24 °C, ce qui couvre aussi le minimum. #}
              {% if assecher %}
                {% set ordre = {'mode': 'heat', 'temp': 24, 'motif': 'assechement'} %}
              {% elif temp_min_ok and mesure < temp_min %}
                {% set ordre = {'mode': 'heat', 'temp': temp_min, 'motif': 'temp_min'} %}
              {% elif froid_ok and occupe and mesure > seuil_froid %}
                {% set ordre = {'mode': 'cool', 'temp': consigne_ete, 'motif': 'froid'} %}
              {% elif chaud_ok and relais.get(p, 'radiateur') == 'clim'
                      and mesure < (cible + 0.5) %}
                {% set ordre = {'mode': 'heat', 'temp': cible, 'motif': 'appoint'} %}
              {% else %}
                {% set ordre = {'mode': 'off', 'temp': 0, 'motif': 'arret'} %}
              {% endif %}
              {% set nd.d = dict(nd.d.items() | list + [(p, ordre)]) %}
            {% endfor %}
            {{ nd.d }}

  ##############################################################################
  # Ce que fait réellement la clim, en clair. Sert à l'illustration du tableau
  # de bord : le mode de l'appareil ne suffit pas, l'assèchement passant lui
  # aussi par le mode chaud.
  ##############################################################################
  - sensor:
      - name: "Clim rôle"
        unique_id: clim_role
        icon: mdi:air-conditioner
        state: >-
          {% if is_state('input_boolean.clim_pilotage_manuel', 'on') %}
            Manuel
          {% else %}
            {% set o = (state_attr('sensor.clim_pilotage', 'ordres') or {}).values() | list %}
            {% set motif = o[0].motif if o else 'arret' %}
            {{ {'temp_min': 'Chauffage', 'appoint': 'Chauffage', 'froid': 'Froid',
                'assechement': 'Assèchement'}.get(motif, 'Arrêt') }}
          {% endif %}

################################################################################
# 3. APPLICATION
################################################################################
automation:
  #
  # `restart` et non `single` : un appui (arrêter l'assèchement, par exemple)
  # arrivant pendant qu'une exécution envoie encore ses ordres au cloud ne
  # doit pas être ignoré ; la dernière intention l'emporte.
  - id: clim_pilotage_automatique
    alias: "Clim - pilotage automatique"
    mode: restart
    trigger:
      - platform: time_pattern
        minutes: "/5"
        id: horloge
      - platform: state
        id: commande
        entity_id:
          - input_boolean.clim_auto_froid
          - input_boolean.clim_auto_chaud
          - input_boolean.clim_assechement
          - input_boolean.clim_maintien_temp_min
          - input_boolean.clim_pilotage_manuel
          - input_boolean.presence_laurent
      - platform: homeassistant
        event: start
        id: demarrage
    condition:
      # Tant que tu pilotes à la main, l'automatisation se tait.
      - condition: state
        entity_id: input_boolean.clim_pilotage_manuel
        state: "off"
    action:
      - delay: "00:00:05"
      - repeat:
          for_each: >-
            {{ (state_attr('sensor.clim_pilotage', 'ordres') or {}) | list }}
          sequence:
            - variables:
                clim: >-
                  {{ (state_attr('sensor.chauffage_configuration', 'pieces')
                      or {})[repeat.item].clim }}
                ordre: >-
                  {{ (state_attr('sensor.clim_pilotage', 'ordres')
                      or {})[repeat.item] }}
            # `if/then` et non `condition:` : une condition qui échoue
            # interromprait la boucle entière, pas la seule itération.
            # Garde anti-rafale (5 min entre deux changements de mode, pour
            # ménager le quota Comfort Cloud) : seulement pour la vérification
            # périodique. Une commande de Laurent passe tout de suite.
            - if:
                - condition: template
                  value_template: >-
                    {{ states(clim) not in ['unknown', 'unavailable']
                       and states(clim) != ordre.mode
                       and (trigger.id != 'horloge'
                            or (now() - states[clim].last_changed)
                               .total_seconds() > 300) }}
              then:
                - service: climate.set_hvac_mode
                  target:
                    entity_id: "{{ clim }}"
                  data:
                    hvac_mode: "{{ ordre.mode }}"
            - if:
                - condition: template
                  value_template: >-
                    {{ ordre.mode in ['cool', 'heat']
                       and states(clim) not in ['unknown', 'unavailable']
                       and (state_attr(clim, 'temperature') | float(default=-99)
                            - ordre.temp | float) | abs > 0.4 }}
              then:
                - service: climate.set_temperature
                  target:
                    entity_id: "{{ clim }}"
                  data:
                    temperature: "{{ ordre.temp }}"

  ##############################################################################
  # Détection d'un réglage à la main.
  #
  # `context.user_id` n'est renseigné que si un humain a agi depuis Home
  # Assistant. Une commande émise par une automatisation en est dépourvue,
  # ce qui évite que le pilotage ne se prenne lui-même pour toi.
  #
  # Limite connue : un réglage fait depuis la télécommande infrarouge ou
  # l'application Comfort Cloud n'a pas non plus de user_id, et passera donc
  # inaperçu. Dans ce cas, active l'interrupteur de pilotage manuel toi-même.
  ##############################################################################
  - id: clim_detection_pilotage_manuel
    alias: "Clim - détecter un réglage manuel"
    mode: single
    trigger:
      - platform: state
        entity_id: climate.clim_chambre
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.context.user_id is not none }}"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.clim_pilotage_manuel

  # Pas de `delay` : un redémarrage de Home Assistant l'annulerait, alors que
  # l'interrupteur retrouve son état « activé ». La clim resterait alors en
  # pilotage manuel pour toujours, et l'automatisation muette. On vérifie
  # plutôt, toutes les 5 minutes, depuis combien de temps il est activé.
  - id: clim_fin_pilotage_manuel
    alias: "Clim - rendre la main à l'automatisation"
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
      - platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.clim_pilotage_manuel
        state: "on"
      - condition: template
        value_template: >-
          {{ (now() - states.input_boolean.clim_pilotage_manuel.last_changed)
             .total_seconds()
             >= states('input_number.clim_duree_manuel') | int(default=180) * 60 }}
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.clim_pilotage_manuel

  ##############################################################################
  # Assèchement à la demande.
  #
  # Appuyer sur le bouton, pour lancer comme pour arrêter, est une demande
  # explicite : elle reprend la main sur un éventuel pilotage manuel en cours,
  # sans quoi l'automatisation resterait muette et rien ne se passerait.
  # `from` et `to` excluent la restauration d'état au démarrage.
  ##############################################################################
  - id: clim_assechement_debut
    alias: "Clim - reprendre la main à chaque appui sur Assécher"
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.clim_assechement
        from: ["on", "off"]
        to: ["on", "off"]
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.clim_pilotage_manuel

  # Fin au bout de la durée choisie. Vérification chaque minute plutôt qu'un
  # `delay`, qu'un redémarrage de Home Assistant annulerait.
  - id: clim_assechement_fin
    alias: "Clim - arrêter l'assèchement"
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.clim_assechement
        state: "on"
      - condition: template
        value_template: >-
          {% set heures = states('input_select.clim_duree_assechement')
                          | replace(' h', '') | int(default=1) %}
          {{ (now() - states.input_boolean.clim_assechement.last_changed)
             .total_seconds() >= heures * 3600 }}
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.clim_assechement
