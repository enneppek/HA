input_number:
  # Une seule température de nuit pour toutes les pièces à vannes.
  chauffage_nuit:
    name: "Température de nuit (toutes les pièces)"
    icon: mdi:weather-night
    min: 7
    max: 20
    step: 0.5
    unit_of_measurement: "°C"
  # --- Températures par pièce -------------------------------------------
  # Pas de `initial:` : HA restaurerait sinon cette valeur à chaque
  # redémarrage, effaçant tout réglage fait depuis la carte. Les valeurs de
  # départ sont posées une seule fois par l'automatisation
  # chauffage_initialiser_reglages.

  chauffage_chambre_leo_confort:
    name: "Chambre Léo - confort"
    icon: mdi:sofa
    min: 15
    max: 24
    step: 0.5
    unit_of_measurement: "°C"


  chauffage_chambre_pablo_confort:
    name: "Chambre Pablo - confort"
    icon: mdi:sofa
    min: 15
    max: 24
    step: 0.5
    unit_of_measurement: "°C"


  chauffage_sdb_enfants_confort:
    name: "Salle de bains enfants - confort"
    icon: mdi:sofa
    min: 15
    max: 24
    step: 0.5
    unit_of_measurement: "°C"


  chauffage_boulangerie_confort:
    name: "Boulangerie - confort"
    icon: mdi:sofa
    min: 15
    max: 24
    step: 0.5
    unit_of_measurement: "°C"


  chauffage_cuisine_confort:
    name: "Cuisine - confort"
    icon: mdi:sofa
    min: 15
    max: 24
    step: 0.5
    unit_of_measurement: "°C"


  chauffage_salon_confort:
    name: "Salon - confort"
    icon: mdi:sofa
    min: 15
    max: 24
    step: 0.5
    unit_of_measurement: "°C"


  # Le Lyric T6 est installé dans la CUISINE. Tel quel, il régule sur la
  # température de cette seule pièce et coupe le brûleur dès qu'elle est
  # satisfaite — privant de chaleur toute la maison. On le détourne donc en
  # relais marche/arrêt : Home Assistant décide, le T6 exécute.
  #
  # Consigne de marche : assez haute pour que le T6 réclame toujours quand
  # HA le veut, mais PAS au maximum. Si Home Assistant tombe en panne, le T6
  # reste sur cette valeur : elle borne alors la température de la cuisine.
  #
  # 24 °C laisse environ 5 °C de marge au-dessus de la consigne de la cuisine.
  # Contrepartie : une cuisson qui pousse la pièce au-delà de 24 °C fera
  # relâcher le brûleur le temps qu'elle redescende. Si cela se produit
  # souvent, relever cette valeur.
  chaudiere_consigne_marche:
    name: "Chaudière - consigne d'appel"
    icon: mdi:fire
    min: 22
    max: 32
    step: 0.5
    unit_of_measurement: "°C"

  chaudiere_consigne_arret:
    name: "Chaudière - consigne de repos"
    icon: mdi:fire-off
    min: 5
    max: 16
    step: 0.5
    unit_of_measurement: "°C"

  duree_confort:
    name: "Durée d'un appui confort"
    icon: mdi:timer-sand
    min: 30
    max: 480
    step: 30
    unit_of_measurement: min

################################################################################
# 11. AUTOMATISATIONS
################################################################################
automation:
  ##############################################################################
  # Applique les consignes calculées aux vannes Sonoff.
  # Déclenchée par les entrées plutôt que par le capteur : un changement
  # d'attribut ne déclenche pas de façon fiable.
  ##############################################################################
  - id: chauffage_application_consignes
    alias: "Chauffage - appliquer les consignes"
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_boolean.presence_leo
          - input_boolean.presence_pablo
          - input_boolean.presence_laurent
          - input_boolean.confort_chambre_leo
          - input_boolean.confort_chambre_pablo
          - input_boolean.confort_sdb_enfants
          - input_boolean.confort_chambre_laurent
          - input_boolean.confort_boulangerie
          - input_boolean.confort_cuisine
          - input_boolean.confort_salon
          - input_number.chauffage_nuit
          - input_text.chauffage_derogations
          - input_number.chauffage_chambre_leo_confort
          - input_boolean.chauffage_chambre_leo_arret
          - input_number.chauffage_chambre_pablo_confort
          - input_boolean.chauffage_chambre_pablo_arret
          - input_number.chauffage_sdb_enfants_confort
          - input_boolean.chauffage_sdb_enfants_arret
          - input_number.chauffage_boulangerie_confort
          - input_boolean.chauffage_boulangerie_arret
          - input_number.chauffage_cuisine_confort
          - input_boolean.chauffage_cuisine_arret
          - input_number.chauffage_salon_confort
          - input_boolean.chauffage_salon_arret
          # Horaires : par défaut, commun, puis propres à chaque pièce. Un
          # déclencheur sur une planification pas encore créée ne fait rien.
          - schedule.chauffage
          - schedule.chauffage_commun
          - schedule.chauffage_chambre_leo
          - schedule.chauffage_chambre_pablo
          - schedule.chauffage_sdb_enfants
          - schedule.chauffage_chambre_laurent
          - schedule.chauffage_boulangerie
          - schedule.chauffage_cuisine
          - schedule.chauffage_salon
      - platform: time_pattern
        minutes: "/15"          # resynchronisation : une vanne peut rater un ordre Zigbee
      - platform: homeassistant
        event: start
    action:
      - delay: "00:00:05"       # laisse le capteur de consignes se recalculer
      - repeat:
          for_each: >-
            {{ (state_attr('sensor.chauffage_configuration', 'pieces') or {})
               | list }}
          sequence:
            - variables:
                piece: "{{ repeat.item }}"
                cfg: >-
                  {{ (state_attr('sensor.chauffage_configuration', 'pieces')
                      or {})[repeat.item] }}
                relais: >-
                  {{ (state_attr('sensor.chauffage_relais', 'relais')
                      or {}).get(repeat.item, 'radiateur') }}
                cible: >-
                  {% set c = (state_attr('sensor.chauffage_consignes', 'consignes')
                              or {}).get(repeat.item, 15) | float(default=15) %}
                  {% set cfg = (state_attr('sensor.chauffage_configuration', 'pieces')
                                or {})[repeat.item] %}
                  {# Si la clim chauffe la pièce, la vanne se referme pour ne pas
                     faire tourner la chaudière en double. #}
                  {{ states('input_number.chauffage_nuit') | float(default=15)
                     if (state_attr('sensor.chauffage_relais', 'relais')
                         or {}).get(repeat.item, 'radiateur') == 'clim'
                     else c }}
            # Boucle imbriquée : une pièce peut porter plusieurs vannes,
            # qui reçoivent toutes la même consigne. `piece` et `cible` sont
            # capturés au-dessus, car `repeat.item` va être redéfini ici.
            - repeat:
                for_each: "{{ cfg.vannes }}"
                sequence:
                  - variables:
                      vanne: "{{ repeat.item }}"
                  # `if/then` et non `condition:` : une condition qui échoue
                  # interromprait la boucle entière, pas la seule itération.
                  - if:
                      - condition: template
                        value_template: >-
                          {{ states(vanne) not in ['unknown', 'unavailable']
                             and (state_attr(vanne, 'temperature')
                                  | float(default=-99) - cible) | abs > 0.2 }}
                    then:
                      # La vanne doit chauffer : 15° tient lieu de hors-gel.
                      - if:
                          - condition: template
                            value_template: "{{ states(vanne) == 'off' }}"
                        then:
                          - service: climate.set_hvac_mode
                            target:
                              entity_id: "{{ vanne }}"
                            data:
                              hvac_mode: heat
                      - service: climate.set_temperature
                        target:
                          entity_id: "{{ vanne }}"
                        data:
                          temperature: "{{ cible }}"

  ##############################################################################
  # Bascule de garde selon la parité de semaine.
  # Semaine PAIRE   -> enfants absents  -> chambres et SdB enfants à 15 °C
  # Semaine IMPAIRE -> enfants présents -> chauffage suivant l'horaire
  ##############################################################################
  #
  # Ne s'exécute que le lundi, quand la semaine change réellement, ou quand
  # le sélecteur de garde change. Ni chaque nuit, ni au redémarrage : un
  # bouton Léo ou Pablo allumé à la main en cours de semaine doit tenir
  # jusqu'au lundi suivant. Les interrupteurs de présence restaurent d'eux-
  # mêmes leur état après un redémarrage.
  - id: chauffage_bascule_garde
    alias: "Chauffage - bascule de semaine"
    mode: single
    trigger:
      - platform: time
        at: "00:05:00"
        id: nuit
      - platform: state
        entity_id: input_select.garde_enfants
        id: selecteur
    condition:
      - condition: template
        value_template: "{{ trigger.id != 'nuit' or now().weekday() == 0 }}"
    action:
      - variables:
          presents: >-
            {% set mode = states('input_select.garde_enfants') %}
            {% if mode == 'Présents' %}true
            {% elif mode == 'Absents' %}false
            {% else %}{{ now().isocalendar()[1] % 2 == 1 }}{% endif %}
      - service: "input_boolean.turn_{{ 'on' if presents | bool else 'off' }}"
        target:
          entity_id:
            - input_boolean.presence_leo
            - input_boolean.presence_pablo

  ##############################################################################
  # Un appui confort s'éteint tout seul, pour ne pas chauffer une pièce vide
  # jusqu'au lendemain.
  ##############################################################################
  #
  # Pas de `delay` : un redémarrage de Home Assistant l'annulerait, alors que
  # l'interrupteur, lui, retrouve son état. Le confort resterait allumé pour
  # toujours. On vérifie plutôt, toutes les 5 minutes, depuis combien de
  # temps chaque bouton est allumé.
  - id: chauffage_extinction_confort
    alias: "Chauffage - extinction automatique du confort"
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
      - platform: homeassistant
        event: start
    variables:
      a_eteindre: >-
        {% set duree = states('input_number.duree_confort') | int(default=120) * 60 %}
        {% set ns = namespace(l=[]) %}
        {% for e in ['input_boolean.confort_chambre_leo', 'input_boolean.confort_chambre_pablo', 'input_boolean.confort_sdb_enfants', 'input_boolean.confort_chambre_laurent', 'input_boolean.confort_boulangerie', 'input_boolean.confort_cuisine', 'input_boolean.confort_salon'] %}
          {% if is_state(e, 'on')
                and (now() - states[e].last_changed).total_seconds() >= duree %}
            {% set ns.l = ns.l + [e] %}
          {% endif %}
        {% endfor %}
        {{ ns.l }}
    condition:
      - condition: template
        value_template: "{{ a_eteindre | count > 0 }}"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: "{{ a_eteindre }}"

  ##############################################################################
  # Chaudière mazout via le Lyric T6, détourné en relais marche/arrêt.
  #
  # Le T6 étant dans la cuisine, le laisser réguler revenait à confier le
  # chauffage de toute la maison à la température d'une seule pièce — celle
  # qui chauffe le plus vite, cuisson comprise. On lui impose donc une
  # consigne d'appel qu'il ne peut atteindre tant que HA réclame, et une
  # consigne de repos sinon. Les températures réelles sont l'affaire des
  # vannes.
  ##############################################################################
  - id: chauffage_pilotage_chaudiere
    alias: "Chauffage - pilotage de la chaudière"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.chauffage_demande_chaudiere
        to: ["on", "off"]
      - platform: state
        entity_id:
          - input_number.chaudiere_consigne_marche
          - input_number.chaudiere_consigne_arret
      - platform: time_pattern
        minutes: "/30"
      - platform: homeassistant
        event: start
    condition:
      - condition: template
        value_template: >-
          {{ states('climate.thermostat_thermostat') not in ['unknown', 'unavailable'] }}
    action:
      - variables:
          cible: >-
            {{ states('sensor.chauffage_consigne_chaudiere')
               | float(default=10) }}
      - condition: template
        value_template: >-
          {{ state_attr('climate.thermostat_thermostat', 'temperature') | float(default=-99)
             != cible | float }}
      - service: climate.set_temperature
        target:
          entity_id: climate.thermostat_thermostat
        data:
          temperature: "{{ cible }}"

  ##############################################################################
  # Injection de la température réelle dans les vannes.
  #
  # Une vanne régule sur sa sonde interne, collée au radiateur, donc trop
  # chaude : elle ferme avant que la pièce soit à température. Quand la pièce
  # dispose d'une vraie sonde d'ambiance, on la pousse dans l'entrée de
  # température externe de chacune de ses vannes.
  #
  # Les pièces sans sonde d'ambiance sont ignorées : il n'y aurait rien de
  # plus juste à leur injecter que ce qu'elles mesurent déjà.
  ##############################################################################
  - id: chauffage_sonde_externe
    alias: "Chauffage - injecter la température réelle dans les vannes"
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/10"
      - platform: homeassistant
        event: start
    action:
      - repeat:
          for_each: >-
            {{ (state_attr('sensor.chauffage_configuration', 'pieces') or {})
               | list }}
          sequence:
            - variables:
                cfg: >-
                  {{ (state_attr('sensor.chauffage_configuration', 'pieces')
                      or {})[repeat.item] }}
                mesure: >-
                  {{ (state_attr('sensor.chauffage_temperatures', 'temperatures')
                      or {}).get(repeat.item) }}
                origine: >-
                  {{ (state_attr('sensor.chauffage_temperatures', 'origine')
                      or {}).get(repeat.item, 'aucune') }}
            - if:
                - condition: template
                  value_template: >-
                    {{ origine == 'sonde' and mesure is not none
                       and cfg.entrees_externes | count > 0 }}
              then:
                - repeat:
                    for_each: "{{ cfg.entrees_externes }}"
                    sequence:
                      - if:
                          - condition: template
                            value_template: >-
                              {{ states(repeat.item)
                                 not in ['unknown', 'unavailable'] }}
                        then:
                          - service: number.set_value
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              value: "{{ mesure | float }}"

  ##############################################################################
  # Initialisation des réglages, une seule fois.
  #
  # Les réglages n'ont pas de `initial:`, pour que HA restaure à chaque
  # redémarrage la dernière valeur choisie. Il faut donc poser les valeurs de
  # départ une fois, à la première mise en service : c'est le rôle de cette
  # automatisation, verrouillée ensuite par chauffage_reglages_initialises.
  #
  # Pour revenir aux valeurs d'usine : éteindre cet interrupteur, puis
  # redémarrer Home Assistant.
  ##############################################################################
  #
  # Une étape par version, chacune verrouillée par son propre interrupteur :
  # un nouveau réglage démarre à sa valeur minimale, il faut donc lui poser
  # sa valeur de départ, sans toucher aux réglages déjà faits.
  - id: chauffage_initialiser_reglages
    alias: "Chauffage - initialiser les réglages (une fois par version)"
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    action:
      # Version 1 : réglages d'origine.
      - if:
          - condition: state
            entity_id: input_boolean.chauffage_reglages_initialises
            state: "off"
        then:
          - repeat:
              for_each:
                - {entite: input_number.chauffage_chambre_leo_confort, valeur: 19.5}
                - {entite: input_number.chauffage_chambre_pablo_confort, valeur: 19.5}
                - {entite: input_number.chauffage_sdb_enfants_confort, valeur: 21.0}
                - {entite: input_number.chauffage_boulangerie_confort, valeur: 19.0}
                - {entite: input_number.chauffage_cuisine_confort, valeur: 19.0}
                - {entite: input_number.chauffage_salon_confort, valeur: 20.5}
                - {entite: input_number.chaudiere_consigne_marche, valeur: 24}
                - {entite: input_number.chaudiere_consigne_arret, valeur: 10}
                - {entite: input_number.duree_confort, valeur: 120}
                - {entite: input_number.clim_temp_min, valeur: 15}
                - {entite: input_number.clim_consigne_horaire, valeur: 19}
                - {entite: input_number.clim_seuil_froid, valeur: 26}
                - {entite: input_number.clim_consigne_ete, valeur: 25}
                - {entite: input_number.clim_seuil_pac, valeur: 5}
              sequence:
                - service: input_number.set_value
                  target:
                    entity_id: "{{ repeat.item.entite }}"
                  data:
                    value: "{{ repeat.item.valeur }}"
          # Comportements voulus par défaut : Lolo à la maison, et la clim de
          # sa chambre qui maintient une température minimale.
          - service: input_boolean.turn_on
            target:
              entity_id:
                - input_boolean.presence_laurent
                - input_boolean.clim_maintien_temp_min
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.chauffage_reglages_initialises
      # Version 2 : nuit unique. (Les boutons « Forcer l'arrêt » démarrent
      # désactivés, ce qui est leur bonne valeur : rien à poser.)
      - if:
          - condition: state
            entity_id: input_boolean.chauffage_reglages_v2
            state: "off"
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.chauffage_nuit
            data:
              value: 15
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.chauffage_reglages_v2

  ##############################################################################
  # Réglage fait à la main sur une vanne : il devient la consigne de la pièce.
  #
  # Chaque vanne renvoie sa consigne (attribut `temperature`). Si elle s'écarte
  # de plus de 0,3 °C de ce que HA veut pour la pièce, c'est qu'on l'a
  # tournée : on enregistre une dérogation. La tolérance absorbe l'arrondi au
  # demi-degré des vannes ; un cran de molette (0,5 °C) la dépasse. Revenir à
  # la consigne de base annule la dérogation.
  #
  # Ce que HA envoie lui-même aux vannes est égal à sa consigne : aucun
  # risque de se prendre pour Laurent.
  ##############################################################################
  - id: chauffage_derogation_vanne
    alias: "Chauffage - réglage fait sur une vanne"
    mode: queued
    max: 10
    trigger:
      - platform: state
        attribute: temperature
        entity_id:
          - climate.vanne_thermo_leo_thermostat
          - climate.vt_thermostat
          - climate.sonoff_trvzb_thermostat
          - climate.vt_boulangerie_thermostat
          - climate.vtherrmo_cuisine_1_thermostat
          - climate.vt_cuisine_couloir_thermostat
          - climate.vt_salon_aquarium_thermostat
          - climate.vt_salon_canape_thermostat
    condition:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.to_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state not in ['unknown', 'unavailable', 'off']
             and trigger.to_state.attributes.temperature is number }}
    action:
      - variables:
          piece: >-
            {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
            {% set ns = namespace(p='') %}
            {% for p, c in cfg.items() if trigger.entity_id in c.vannes %}
              {% set ns.p = p %}
            {% endfor %}
            {{ ns.p }}
          demandee: "{{ trigger.to_state.attributes.temperature | float }}"
          voulue: >-
            {{ (state_attr('sensor.chauffage_consignes', 'consignes') or {})
                .get(piece, none) }}
          base: >-
            {{ (state_attr('sensor.chauffage_consignes', 'consignes_base') or {})
                .get(piece, none) }}
      - condition: template
        value_template: >-
          {{ piece != '' and voulue is number and base is number
             and (demandee - voulue) | abs > 0.3 }}
      - service: input_text.set_value
        target:
          entity_id: input_text.chauffage_derogations
        data:
          value: >-
            {% set brut = states('input_text.chauffage_derogations') %}
            {% set d = brut | from_json if brut.startswith('{') else {} %}
            {% set autres = d.items() | rejectattr('0', 'eq', piece) | list %}
            {% set ajout = [(piece, [demandee, base])]
                           if (demandee - base) | abs > 0.3 else [] %}
            {{ dict(autres + ajout) | to_json }}

  ##############################################################################
  # Fin des dérogations : dès que la consigne de base d'une pièce change
  # (nouvelle plage, départ ou retour d'un occupant), sa dérogation est
  # retirée. Sans ce ménage, une dérogation périmée reviendrait le lendemain,
  # à la même plage.
  ##############################################################################
  - id: chauffage_derogation_fin
    alias: "Chauffage - fin des réglages faits sur les vannes"
    mode: queued
    max: 5
    trigger:
      - platform: state
        entity_id: sensor.chauffage_consignes
        attribute: consignes_base
      - platform: time_pattern
        minutes: "/15"
    variables:
      actuelles: >-
        {% set brut = states('input_text.chauffage_derogations') %}
        {{ (brut | from_json if brut.startswith('{') else {}) | to_json }}
      restantes: >-
        {% set brut = states('input_text.chauffage_derogations') %}
        {% set d = brut | from_json if brut.startswith('{') else {} %}
        {% set bases = state_attr('sensor.chauffage_consignes', 'consignes_base') or {} %}
        {% set ns = namespace(d={}) %}
        {% for p, v in d.items() if p in bases
              and ((v[1] | float(default=-99)) - bases[p]) | abs < 0.05 %}
          {% set ns.d = dict(ns.d.items() | list + [(p, v)]) %}
        {% endfor %}
        {{ ns.d | to_json }}
    condition:
      - condition: template
        value_template: "{{ restantes != actuelles }}"
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.chauffage_derogations
        data:
          value: "{{ restantes }}"
