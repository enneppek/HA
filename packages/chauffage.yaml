################################################################################
# CHAUFFAGE — pilotage par présence, parité de semaine et horaire
#
# Principe : toute la logique est centralisée dans sensor.chauffage_consignes,
# qui calcule une température cible par pièce. Les automatisations ne font
# qu'appliquer ce calcul aux vannes. Pour modifier le comportement, il suffit
# donc de toucher au bloc de configuration ci-dessous.
#
# >>> LES IDENTIFIANTS D'ENTITÉS SONT DES SUPPOSITIONS <<<
# Remplacer ceux du bloc `pieces` par les vrais (voir outils/export_entites.jinja).
################################################################################

################################################################################
# 1. CONFIGURATION DES PIÈCES — le seul bloc à adapter
################################################################################
template:
  - sensor:
      - name: "Chauffage configuration"
        unique_id: chauffage_configuration
        icon: mdi:home-thermometer
        state: >-
          {{ state_attr('sensor.chauffage_configuration', 'pieces') | count
             if state_attr('sensor.chauffage_configuration', 'pieces') else 5 }}
        attributes:
          pieces: >-
            {# Entités relevées sur l'instance le 24/09/2026.

               Trois sondes d'ambiance, une par chambre : Léo, Pablo, Lolo.
               La cuisine emprunte celle du Lyric T6, qui s'y trouve. Les
               autres pièces se rabattent sur les sondes internes de leurs
               vannes — voir le README.

               `sonde` à `none` : la pièce n'a pas de sonde d'ambiance. La
               température est alors reprise des sondes internes des vannes,
               moins fiables (collées au radiateur) mais suffisantes pour
               décider s'il faut appeler la chaudière.

               La boulangerie a en plus un poêle à bois. Rien à prévoir :
               quand il tourne, la pièce dépasse sa consigne, cesse de
               réclamer, et sa vanne se ferme d'elle-même. #}
            {{
              {
                'chambre_leo': {
                  'nom': 'Chambre Léo',
                  'vannes': ['climate.vanne_thermo_leo_thermostat'],
                  'entrees_externes': ['number.vanne_thermo_leo_valeur_du_capteur_de_temperature_externe'],
                  'sonde': 'sensor.t_hr_temperature',
                  'humidite': 'sensor.t_hr_humidite',
                  'occupants': ['leo'],
                  'clim': none,
                  'confort': 19.5
                },
                'chambre_pablo': {
                  'nom': 'Chambre Pablo',
                  'vannes': ['climate.vt_thermostat'],
                  'entrees_externes': ['number.vt_valeur_du_capteur_de_temperature_externe'],
                  'sonde': 'sensor.sonoff_t_hr_2_temperature',
                  'humidite': 'sensor.sonoff_t_hr_2_humidite',
                  'occupants': ['pablo'],
                  'clim': none,
                  'confort': 19.5
                },
                'sdb_enfants': {
                  'nom': 'Salle de bains enfants',
                  'vannes': ['climate.sonoff_trvzb_thermostat'],
                  'entrees_externes': ['number.sonoff_trvzb_valeur_du_capteur_de_temperature_externe'],
                  'sonde': none,
                  'humidite': none,
                  'occupants': ['leo', 'pablo'],
                  'clim': none,
                  'confort': 21.0
                },
                'chambre_laurent': {
                  'nom': 'Chambre Lolo',
                  'vannes': [],
                  'entrees_externes': [],
                  'sonde': 'sensor.sonoff_snzb_02d_temperature',
                  'humidite': 'sensor.sonoff_snzb_02d_humidite',
                  'occupants': ['laurent'],
                  'clim': 'climate.clim_chambre',
                  'horaire_clim': 'schedule.clim_chambre',
                  'confort': 19.5
                },
                'boulangerie': {
                  'nom': 'Boulangerie',
                  'vannes': ['climate.vt_boulangerie_thermostat'],
                  'entrees_externes': ['number.vt_boulangerie_valeur_du_capteur_de_temperature_externe'],
                  'sonde': none,
                  'humidite': none,
                  'occupants': ['laurent'],
                  'clim': none,
                  'confort': 19.0
                },
                'cuisine': {
                  'nom': 'Cuisine',
                  'vannes': ['climate.vtherrmo_cuisine_1_thermostat',
                             'climate.vt_cuisine_couloir_thermostat'],
                  'entrees_externes': ['number.vtherrmo_cuisine_1_valeur_du_capteur_de_temperature_externe',
                                       'number.vt_cuisine_couloir_valeur_du_capteur_de_temperature_externe'],
                  'sonde': 'sensor.thermostat_thermostat_indoor_temperature',
                  'humidite': none,
                  'occupants': ['leo', 'pablo', 'laurent'],
                  'clim': none,
                  'confort': 19.0
                },
                'salon': {
                  'nom': 'Salon',
                  'vannes': ['climate.vt_salon_aquarium_thermostat',
                             'climate.vt_salon_canape_thermostat'],
                  'entrees_externes': ['number.vt_salon_aquarium_valeur_du_capteur_de_temperature_externe',
                                       'number.vt_salon_canape_valeur_du_capteur_de_temperature_externe'],
                  'sonde': none,
                  'humidite': none,
                  'occupants': ['leo', 'pablo', 'laurent'],
                  'clim': none,
                  'confort': 20.5
                }
              }
            }}

  ##############################################################################
  # 2. TEMPÉRATURE DE CHAQUE PIÈCE
  #
  # Toutes les pièces n'ont pas de sonde d'ambiance. À défaut, on reprend la
  # moyenne des sondes internes de ses vannes : elles lisent au ras du
  # radiateur, donc trop chaud, mais suffisent à décider d'appeler ou non la
  # chaudière. Une pièce sans aucune mesure vaut `none`, et sera traitée plus
  # loin comme n'ayant pas besoin de chaleur — mieux vaut ne pas chauffer à
  # l'aveugle que de faire tourner le brûleur sans savoir.
  ##############################################################################
  - sensor:
      - name: "Chauffage températures"
        unique_id: chauffage_temperatures
        icon: mdi:thermometer-lines
        state: >-
          {% set t = state_attr('sensor.chauffage_temperatures', 'temperatures') or {} %}
          {{ t.values() | reject('none') | list | count }}
        attributes:
          temperatures: >-
            {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
            {% set nd = namespace(d={}) %}
            {% for p, c in cfg.items() %}
              {% set directe = states(c.sonde) if c.sonde else 'unknown' %}
              {% if directe not in ['unknown', 'unavailable', 'none', ''] %}
                {% set t = directe | float(default=none) %}
              {% else %}
                {% set ns = namespace(lues=[]) %}
                {% for v in c.vannes %}
                  {% set lue = state_attr(v, 'current_temperature') %}
                  {% if lue is not none %}
                    {% set ns.lues = ns.lues + [lue | float(default=0)] %}
                  {% endif %}
                {% endfor %}
                {% set t = ((ns.lues | sum) / (ns.lues | count)) | round(1)
                           if ns.lues | count > 0 else none %}
              {% endif %}
              {% set nd.d = dict(nd.d.items() | list + [(p, t)]) %}
            {% endfor %}
            {{ nd.d }}
          origine: >-
            {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
            {% set nd = namespace(d={}) %}
            {% for p, c in cfg.items() %}
              {% set directe = states(c.sonde) if c.sonde else 'unknown' %}
              {% set o = 'sonde' if directe not in ['unknown', 'unavailable', 'none', '']
                         else ('vannes' if c.vannes | count > 0 else 'aucune') %}
              {% set nd.d = dict(nd.d.items() | list + [(p, o)]) %}
            {% endfor %}
            {{ nd.d }}

  ##############################################################################
  # 3. CALCUL DES CONSIGNES — cœur de la logique
  #
  # Priorité, de la plus forte à la plus faible :
  #   1. Bouton confort de la pièce pressé      -> température de confort
  #   2. Un occupant présent + horaire actif    -> température de confort
  #   3. Tout le reste                          -> température de nuit (15°)
  #      (hors horaire, occupant absent, ou arrêt forcé)
  #
  # Le confort se règle pièce par pièce (input_number.chauffage_<pièce>_confort,
  # repli sur le bloc `pieces`). La nuit est unique pour toutes les pièces
  # à vannes (input_number.chauffage_nuit). Chaque pièce a un bouton
  # « Forcer l'arrêt » (input_boolean.chauffage_<pièce>_arret) : allumé, elle
  # reste à la nuit ; seuls le confort immédiat et une vanne réglée à la main
  # passent outre.
  #
  # Consigne par plage : une plage peut porter sa propre température dans ses
  # « données supplémentaires » (`temperature: 24`) ; pendant cette plage,
  # c'est la consigne de confort de la pièce.
  #
  # Dérogation : une température réglée à la main sur une vanne devient la
  # consigne de la pièce jusqu'au prochain changement de la consigne de base
  # (changement de plage, départ ou retour d'un occupant). Mémorisée dans
  # input_text.chauffage_derogations : {pièce: [réglée, base au moment du
  # réglage]}.
  #
  # Horaire : chaque pièce suit sa propre planification si elle existe
  # (schedule.chauffage_<pièce>, créée dans l'interface), sinon l'horaire
  # commun (schedule.chauffage_commun, créé dans l'interface), sinon l'horaire
  # par défaut défini plus bas en YAML. Seules les planifications créées dans
  # l'interface sont modifiables à la souris ; celle en YAML ne l'est pas.
  ##############################################################################
  - sensor:
      - name: "Chauffage consignes"
        unique_id: chauffage_consignes
        unit_of_measurement: "°C"
        state: >-
          {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
          {% set ns = namespace(presents=[]) %}
          {% for q in ['leo', 'pablo', 'laurent'] %}
            {% if is_state('input_boolean.presence_' ~ q, 'on') %}
              {% set ns.presents = ns.presents + [q] %}
            {% endif %}
          {% endfor %}
          {% set commun = 'schedule.chauffage_commun'
             if states('schedule.chauffage_commun') in ['on', 'off']
             else 'schedule.chauffage' %}
          {% set brut = states('input_text.chauffage_derogations') %}
          {% set derogations = brut | from_json if brut.startswith('{') else {} %}
          {% set nd = namespace(consignes={}, bases={}, horaires={}, derogees=[]) %}
          {% for p, c in cfg.items() %}
            {% set occupe = c.occupants | select('in', ns.presents) | list | count > 0 %}
            {% set boost = is_state('input_boolean.confort_' ~ p, 'on') %}
            {% set confort = states('input_number.chauffage_' ~ p ~ '_confort')
                             | float(default=c.confort) %}
            {# Une seule température de nuit pour toutes les pièces à vannes : hors
               horaire, occupant absent, ou pièce dont le chauffage est coupé. #}
            {% set nuit = states('input_number.chauffage_nuit') | float(default=15) %}
            {# Bouton « Forcer l'arrêt » : allumé, la pièce reste à la nuit. #}
            {% set arret = is_state('input_boolean.chauffage_' ~ p ~ '_arret', 'on') %}
            {% set propre = 'schedule.chauffage_' ~ p %}
            {% set h = propre if states(propre) in ['on', 'off'] else commun %}
            {% set horaire = is_state(h, 'on') %}
            {# Température propre à la plage en cours, saisie dans ses « données
               supplémentaires » (temperature: 24). Sans elle : le curseur Confort. #}
            {% set t_plage = (state_attr(h, 'temperature') if state_attr(h, 'temperature') is not none
                              else state_attr(h, 'consigne')) if horaire else none %}
            {% set confort_plage = t_plage | float(default=confort)
                                   if t_plage is not none else confort %}
            {% set base = ([confort, confort_plage] | max) if boost
                          else (confort_plage if (not arret and occupe and horaire) else nuit) %}
            {# Dérogation : température réglée à la main sur une vanne. Elle ne vaut
               que tant que la consigne de base n'a pas changé depuis. #}
            {% set dg = derogations.get(p) %}
            {% set derogee = dg is not none and dg | count == 2
                             and ((dg[1] | float(default=-99)) - base) | abs < 0.05 %}
            {% set t = (dg[0] | float(default=base)) if derogee else base %}
            {% set nd.consignes = dict(nd.consignes.items() | list + [(p, t | float)]) %}
            {% set nd.bases = dict(nd.bases.items() | list + [(p, base | float)]) %}
            {% set nd.horaires = dict(nd.horaires.items() | list + [(p, h)]) %}
            {% if derogee %}{% set nd.derogees = nd.derogees + [p] %}{% endif %}
          {% endfor %}
          {{ nd.consignes.values() | max if nd.consignes else 0 }}
        attributes:
          consignes: >-
            {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
            {% set ns = namespace(presents=[]) %}
            {% for q in ['leo', 'pablo', 'laurent'] %}
              {% if is_state('input_boolean.presence_' ~ q, 'on') %}
                {% set ns.presents = ns.presents + [q] %}
              {% endif %}
            {% endfor %}
            {% set commun = 'schedule.chauffage_commun'
               if states('schedule.chauffage_commun') in ['on', 'off']
               else 'schedule.chauffage' %}
            {% set brut = states('input_text.chauffage_derogations') %}
            {% set derogations = brut | from_json if brut.startswith('{') else {} %}
            {% set nd = namespace(consignes={}, bases={}, horaires={}, derogees=[]) %}
            {% for p, c in cfg.items() %}
              {% set occupe = c.occupants | select('in', ns.presents) | list | count > 0 %}
              {% set boost = is_state('input_boolean.confort_' ~ p, 'on') %}
              {% set confort = states('input_number.chauffage_' ~ p ~ '_confort')
                               | float(default=c.confort) %}
              {# Une seule température de nuit pour toutes les pièces à vannes : hors
                 horaire, occupant absent, ou pièce dont le chauffage est coupé. #}
              {% set nuit = states('input_number.chauffage_nuit') | float(default=15) %}
              {# Bouton « Forcer l'arrêt » : allumé, la pièce reste à la nuit. #}
              {% set arret = is_state('input_boolean.chauffage_' ~ p ~ '_arret', 'on') %}
              {% set propre = 'schedule.chauffage_' ~ p %}
              {% set h = propre if states(propre) in ['on', 'off'] else commun %}
              {% set horaire = is_state(h, 'on') %}
              {# Température propre à la plage en cours, saisie dans ses « données
                 supplémentaires » (temperature: 24). Sans elle : le curseur Confort. #}
              {% set t_plage = (state_attr(h, 'temperature') if state_attr(h, 'temperature') is not none
                                else state_attr(h, 'consigne')) if horaire else none %}
              {% set confort_plage = t_plage | float(default=confort)
                                     if t_plage is not none else confort %}
              {% set base = ([confort, confort_plage] | max) if boost
                            else (confort_plage if (not arret and occupe and horaire) else nuit) %}
              {# Dérogation : température réglée à la main sur une vanne. Elle ne vaut
                 que tant que la consigne de base n'a pas changé depuis. #}
              {% set dg = derogations.get(p) %}
              {% set derogee = dg is not none and dg | count == 2
                               and ((dg[1] | float(default=-99)) - base) | abs < 0.05 %}
              {% set t = (dg[0] | float(default=base)) if derogee else base %}
              {% set nd.consignes = dict(nd.consignes.items() | list + [(p, t | float)]) %}
              {% set nd.bases = dict(nd.bases.items() | list + [(p, base | float)]) %}
              {% set nd.horaires = dict(nd.horaires.items() | list + [(p, h)]) %}
              {% if derogee %}{% set nd.derogees = nd.derogees + [p] %}{% endif %}
            {% endfor %}
            {{ nd.consignes }}
          consignes_base: >-
            {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
            {% set ns = namespace(presents=[]) %}
            {% for q in ['leo', 'pablo', 'laurent'] %}
              {% if is_state('input_boolean.presence_' ~ q, 'on') %}
                {% set ns.presents = ns.presents + [q] %}
              {% endif %}
            {% endfor %}
            {% set commun = 'schedule.chauffage_commun'
               if states('schedule.chauffage_commun') in ['on', 'off']
               else 'schedule.chauffage' %}
            {% set brut = states('input_text.chauffage_derogations') %}
            {% set derogations = brut | from_json if brut.startswith('{') else {} %}
            {% set nd = namespace(consignes={}, bases={}, horaires={}, derogees=[]) %}
            {% for p, c in cfg.items() %}
              {% set occupe = c.occupants | select('in', ns.presents) | list | count > 0 %}
              {% set boost = is_state('input_boolean.confort_' ~ p, 'on') %}
              {% set confort = states('input_number.chauffage_' ~ p ~ '_confort')
                               | float(default=c.confort) %}
              {# Une seule température de nuit pour toutes les pièces à vannes : hors
                 horaire, occupant absent, ou pièce dont le chauffage est coupé. #}
              {% set nuit = states('input_number.chauffage_nuit') | float(default=15) %}
              {# Bouton « Forcer l'arrêt » : allumé, la pièce reste à la nuit. #}
              {% set arret = is_state('input_boolean.chauffage_' ~ p ~ '_arret', 'on') %}
              {% set propre = 'schedule.chauffage_' ~ p %}
              {% set h = propre if states(propre) in ['on', 'off'] else commun %}
              {% set horaire = is_state(h, 'on') %}
              {# Température propre à la plage en cours, saisie dans ses « données
                 supplémentaires » (temperature: 24). Sans elle : le curseur Confort. #}
              {% set t_plage = (state_attr(h, 'temperature') if state_attr(h, 'temperature') is not none
                                else state_attr(h, 'consigne')) if horaire else none %}
              {% set confort_plage = t_plage | float(default=confort)
                                     if t_plage is not none else confort %}
              {% set base = ([confort, confort_plage] | max) if boost
                            else (confort_plage if (not arret and occupe and horaire) else nuit) %}
              {# Dérogation : température réglée à la main sur une vanne. Elle ne vaut
                 que tant que la consigne de base n'a pas changé depuis. #}
              {% set dg = derogations.get(p) %}
              {% set derogee = dg is not none and dg | count == 2
                               and ((dg[1] | float(default=-99)) - base) | abs < 0.05 %}
              {% set t = (dg[0] | float(default=base)) if derogee else base %}
              {% set nd.consignes = dict(nd.consignes.items() | list + [(p, t | float)]) %}
              {% set nd.bases = dict(nd.bases.items() | list + [(p, base | float)]) %}
              {% set nd.horaires = dict(nd.horaires.items() | list + [(p, h)]) %}
              {% if derogee %}{% set nd.derogees = nd.derogees + [p] %}{% endif %}
            {% endfor %}
            {{ nd.bases }}
          horaires: >-
            {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
            {% set ns = namespace(presents=[]) %}
            {% for q in ['leo', 'pablo', 'laurent'] %}
              {% if is_state('input_boolean.presence_' ~ q, 'on') %}
                {% set ns.presents = ns.presents + [q] %}
              {% endif %}
            {% endfor %}
            {% set commun = 'schedule.chauffage_commun'
               if states('schedule.chauffage_commun') in ['on', 'off']
               else 'schedule.chauffage' %}
            {% set brut = states('input_text.chauffage_derogations') %}
            {% set derogations = brut | from_json if brut.startswith('{') else {} %}
            {% set nd = namespace(consignes={}, bases={}, horaires={}, derogees=[]) %}
            {% for p, c in cfg.items() %}
              {% set occupe = c.occupants | select('in', ns.presents) | list | count > 0 %}
              {% set boost = is_state('input_boolean.confort_' ~ p, 'on') %}
              {% set confort = states('input_number.chauffage_' ~ p ~ '_confort')
                               | float(default=c.confort) %}
              {# Une seule température de nuit pour toutes les pièces à vannes : hors
                 horaire, occupant absent, ou pièce dont le chauffage est coupé. #}
              {% set nuit = states('input_number.chauffage_nuit') | float(default=15) %}
              {# Bouton « Forcer l'arrêt » : allumé, la pièce reste à la nuit. #}
              {% set arret = is_state('input_boolean.chauffage_' ~ p ~ '_arret', 'on') %}
              {% set propre = 'schedule.chauffage_' ~ p %}
              {% set h = propre if states(propre) in ['on', 'off'] else commun %}
              {% set horaire = is_state(h, 'on') %}
              {# Température propre à la plage en cours, saisie dans ses « données
                 supplémentaires » (temperature: 24). Sans elle : le curseur Confort. #}
              {% set t_plage = (state_attr(h, 'temperature') if state_attr(h, 'temperature') is not none
                                else state_attr(h, 'consigne')) if horaire else none %}
              {% set confort_plage = t_plage | float(default=confort)
                                     if t_plage is not none else confort %}
              {% set base = ([confort, confort_plage] | max) if boost
                            else (confort_plage if (not arret and occupe and horaire) else nuit) %}
              {# Dérogation : température réglée à la main sur une vanne. Elle ne vaut
                 que tant que la consigne de base n'a pas changé depuis. #}
              {% set dg = derogations.get(p) %}
              {% set derogee = dg is not none and dg | count == 2
                               and ((dg[1] | float(default=-99)) - base) | abs < 0.05 %}
              {% set t = (dg[0] | float(default=base)) if derogee else base %}
              {% set nd.consignes = dict(nd.consignes.items() | list + [(p, t | float)]) %}
              {% set nd.bases = dict(nd.bases.items() | list + [(p, base | float)]) %}
              {% set nd.horaires = dict(nd.horaires.items() | list + [(p, h)]) %}
              {% if derogee %}{% set nd.derogees = nd.derogees + [p] %}{% endif %}
            {% endfor %}
            {{ nd.horaires }}
          derogations: >-
            {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
            {% set ns = namespace(presents=[]) %}
            {% for q in ['leo', 'pablo', 'laurent'] %}
              {% if is_state('input_boolean.presence_' ~ q, 'on') %}
                {% set ns.presents = ns.presents + [q] %}
              {% endif %}
            {% endfor %}
            {% set commun = 'schedule.chauffage_commun'
               if states('schedule.chauffage_commun') in ['on', 'off']
               else 'schedule.chauffage' %}
            {% set brut = states('input_text.chauffage_derogations') %}
            {% set derogations = brut | from_json if brut.startswith('{') else {} %}
            {% set nd = namespace(consignes={}, bases={}, horaires={}, derogees=[]) %}
            {% for p, c in cfg.items() %}
              {% set occupe = c.occupants | select('in', ns.presents) | list | count > 0 %}
              {% set boost = is_state('input_boolean.confort_' ~ p, 'on') %}
              {% set confort = states('input_number.chauffage_' ~ p ~ '_confort')
                               | float(default=c.confort) %}
              {# Une seule température de nuit pour toutes les pièces à vannes : hors
                 horaire, occupant absent, ou pièce dont le chauffage est coupé. #}
              {% set nuit = states('input_number.chauffage_nuit') | float(default=15) %}
              {# Bouton « Forcer l'arrêt » : allumé, la pièce reste à la nuit. #}
              {% set arret = is_state('input_boolean.chauffage_' ~ p ~ '_arret', 'on') %}
              {% set propre = 'schedule.chauffage_' ~ p %}
              {% set h = propre if states(propre) in ['on', 'off'] else commun %}
              {% set horaire = is_state(h, 'on') %}
              {# Température propre à la plage en cours, saisie dans ses « données
                 supplémentaires » (temperature: 24). Sans elle : le curseur Confort. #}
              {% set t_plage = (state_attr(h, 'temperature') if state_attr(h, 'temperature') is not none
                                else state_attr(h, 'consigne')) if horaire else none %}
              {% set confort_plage = t_plage | float(default=confort)
                                     if t_plage is not none else confort %}
              {% set base = ([confort, confort_plage] | max) if boost
                            else (confort_plage if (not arret and occupe and horaire) else nuit) %}
              {# Dérogation : température réglée à la main sur une vanne. Elle ne vaut
                 que tant que la consigne de base n'a pas changé depuis. #}
              {% set dg = derogations.get(p) %}
              {% set derogee = dg is not none and dg | count == 2
                               and ((dg[1] | float(default=-99)) - base) | abs < 0.05 %}
              {% set t = (dg[0] | float(default=base)) if derogee else base %}
              {% set nd.consignes = dict(nd.consignes.items() | list + [(p, t | float)]) %}
              {% set nd.bases = dict(nd.bases.items() | list + [(p, base | float)]) %}
              {% set nd.horaires = dict(nd.horaires.items() | list + [(p, h)]) %}
              {% if derogee %}{% set nd.derogees = nd.derogees + [p] %}{% endif %}
            {% endfor %}
            {{ nd.derogees }}
          horaire_actif: >-
            {% set commun = 'schedule.chauffage_commun'
               if states('schedule.chauffage_commun') in ['on', 'off']
               else 'schedule.chauffage' %}
            {{ is_state(commun, 'on') }}
          semaine_numero: "{{ now().isocalendar()[1] }}"
          semaine_paire: "{{ now().isocalendar()[1] % 2 == 0 }}"

  ##############################################################################
  # 4. TEMPÉRATURE EXTÉRIEURE
  # Arbitre le recours à la clim en chauffage : une pompe à chaleur perd son
  # avantage sur le mazout quand il gèle. Repli sur l'entité météo si aucune
  # sonde extérieure n'est disponible.
  ##############################################################################
  - sensor:
      - name: "Chauffage température extérieure"
        unique_id: chauffage_temperature_exterieure
        unit_of_measurement: "°C"
        device_class: temperature
        state: >-
          {# Le Lyric T6 et la clim fournissent chacun une mesure extérieure.
             Le T6 d'abord, la clim ensuite, la météo en dernier recours. #}
          {% set sources = ['sensor.thermostat_thermostat_outdoor_temperature',
                            'sensor.clim_chambre_outside_temperature'] %}
          {% set ns = namespace(t=none) %}
          {% for s in sources if ns.t is none %}
            {% if states(s) not in ['unknown', 'unavailable', 'none', ''] %}
              {% set ns.t = states(s) | float(default=none) %}
            {% endif %}
          {% endfor %}
          {{ ns.t if ns.t is not none
             else state_attr('weather.forecast_maison', 'temperature')
                  | float(default=10) }}

  ##############################################################################
  # 5. ARBITRAGE — qui délivre la chaleur dans chaque pièce ?
  #
  # Règle : la clim ne prend une pièce en charge que si elle y est installée,
  # que l'appoint est autorisé, qu'il ne fait pas trop froid dehors pour que
  # la PAC reste rentable, et que la pièce réclame effectivement.
  # Sinon, radiateur. Deux sources de chaleur simultanées gaspilleraient.
  ##############################################################################
  - sensor:
      - name: "Chauffage relais"
        unique_id: chauffage_relais
        icon: mdi:call-split
        state: >-
          {% set r = state_attr('sensor.chauffage_relais', 'relais') or {} %}
          {{ r.values() | select('eq', 'clim') | list | count }}
        attributes:
          relais: >-
            {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
            {% set consignes = state_attr('sensor.chauffage_consignes', 'consignes') or {} %}
            {% set text = states('sensor.chauffage_temperature_exterieure')
                          | float(default=10) %}
            {% set seuil = states('input_number.clim_seuil_pac') | float(default=5) %}
            {% set autorise = is_state('input_boolean.clim_auto_chaud', 'on') %}
            {% set temps = state_attr('sensor.chauffage_temperatures', 'temperatures') or {} %}
            {% set nd = namespace(d={}) %}
            {% for p, c in cfg.items() %}
              {% set mesure = temps.get(p) | float(default=99) %}
              {% set cible = consignes.get(p, 0) | float(default=0) %}
              {% set demande = mesure < (cible - 0.3) %}
              {# Sans radiateur, la clim assure la pièce en toute saison :
                 le seuil de rentabilité de la PAC ne s'applique pas, il n'y a
                 pas d'alternative. #}
              {% set sans_radiateur = c.vannes | count == 0 %}
              {% set v = 'clim' if (c.clim and (sans_radiateur
                                    or (autorise and text >= seuil and demande)))
                         else 'radiateur' %}
              {% set nd.d = dict(nd.d.items() | list + [(p, v)]) %}
            {% endfor %}
            {{ nd.d }}

  ##############################################################################
  # 6. DEMANDE CHAUDIÈRE
  # Vrai dès qu'une pièce accuse un déficit > 0.3 °C. Le delay_off de 10 min
  # évite que la chaudière ne cycle en courts créneaux.
  ##############################################################################
  - binary_sensor:
      - name: "Chauffage demande chaudière"
        unique_id: chauffage_demande_chaudiere
        device_class: heat
        delay_off: "00:10:00"
        state: >-
          {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
          {% set consignes = state_attr('sensor.chauffage_consignes', 'consignes') or {} %}
          {% set relais = state_attr('sensor.chauffage_relais', 'relais') or {} %}
          {% set temps = state_attr('sensor.chauffage_temperatures', 'temperatures') or {} %}
          {% set ns = namespace(demande=false) %}
          {% for p, c in cfg.items() %}
            {% set mesure = temps.get(p) | float(default=99) %}
            {% set cible = consignes.get(p, 0) | float(default=0) %}
            {% if mesure < (cible - 0.3)
                  and relais.get(p, 'radiateur') == 'radiateur' %}
              {% set ns.demande = true %}
            {% endif %}
          {% endfor %}
          {{ ns.demande }}
        attributes:
          deficit_max: >-
            {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
            {% set consignes = state_attr('sensor.chauffage_consignes', 'consignes') or {} %}
            {% set temps = state_attr('sensor.chauffage_temperatures', 'temperatures') or {} %}
            {% set ns = namespace(d=0) %}
            {% for p, c in cfg.items() %}
              {% set ecart = (consignes.get(p, 0) | float(default=0))
                             - (temps.get(p) | float(default=99)) %}
              {% if ecart > ns.d %}{% set ns.d = ecart %}{% endif %}
            {% endfor %}
            {{ ns.d | round(1) }}

  ##############################################################################
  # 7. CONSIGNE ENVOYÉE AU LYRIC T6
  #
  # Le T6 n'est plus un thermostat mais un interrupteur : soit on le pousse
  # assez haut pour qu'il appelle le brûleur, soit assez bas pour qu'il le
  # relâche. Ce sont les vannes, pièce par pièce, qui règlent réellement les
  # températures.
  ##############################################################################
  - sensor:
      - name: "Chauffage consigne chaudière"
        unique_id: chauffage_consigne_chaudiere
        unit_of_measurement: "°C"
        device_class: temperature
        state: >-
          {{ states('input_number.chaudiere_consigne_marche') | float(default=24)
             if is_state('binary_sensor.chauffage_demande_chaudiere', 'on')
             else states('input_number.chaudiere_consigne_arret') | float(default=10) }}

      # L'état de la chaudière en clair, pour l'illustration du tableau de
      # bord : un binary_sensor de classe « heat » s'affiche « Chaud » ou
      # « Normal », peu parlant.
      - name: "Chauffage état chaudière"
        unique_id: chauffage_etat_chaudiere
        icon: mdi:fire
        state: >-
          {{ 'en marche' if is_state('binary_sensor.chauffage_demande_chaudiere', 'on')
             else 'au repos' }}

  ##############################################################################
  # 8. UN CAPTEUR PAR PIÈCE, pour le tableau de bord
  #
  # Les cadrans et les courbes ont besoin d'une entité par grandeur, là où les
  # capteurs ci-dessus regroupent toutes les pièces dans un attribut. Ces
  # capteurs n'en sont que la projection ; `state_class: measurement` ouvre
  # en plus l'historique long terme. Le nom, tiré de la clé de la pièce, fixe
  # l'identifiant : les cartes affichent leur propre libellé.
  ##############################################################################
  - sensor:
      - name: "Chauffage chambre leo température"
        unique_id: chauffage_chambre_leo_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >-
          {{ (state_attr('sensor.chauffage_temperatures', 'temperatures') or {})
             .get('chambre_leo') is not none }}
        state: >-
          {{ (state_attr('sensor.chauffage_temperatures', 'temperatures') or {})
             .get('chambre_leo') }}
      - name: "Chauffage chambre pablo température"
        unique_id: chauffage_chambre_pablo_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >-
          {{ (state_attr('sensor.chauffage_temperatures', 'temperatures') or {})
             .get('chambre_pablo') is not none }}
        state: >-
          {{ (state_attr('sensor.chauffage_temperatures', 'temperatures') or {})
             .get('chambre_pablo') }}
      - name: "Chauffage sdb enfants température"
        unique_id: chauffage_sdb_enfants_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >-
          {{ (state_attr('sensor.chauffage_temperatures', 'temperatures') or {})
             .get('sdb_enfants') is not none }}
        state: >-
          {{ (state_attr('sensor.chauffage_temperatures', 'temperatures') or {})
             .get('sdb_enfants') }}
      - name: "Chauffage chambre laurent température"
        unique_id: chauffage_chambre_laurent_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >-
          {{ (state_attr('sensor.chauffage_temperatures', 'temperatures') or {})
             .get('chambre_laurent') is not none }}
        state: >-
          {{ (state_attr('sensor.chauffage_temperatures', 'temperatures') or {})
             .get('chambre_laurent') }}
      - name: "Chauffage boulangerie température"
        unique_id: chauffage_boulangerie_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >-
          {{ (state_attr('sensor.chauffage_temperatures', 'temperatures') or {})
             .get('boulangerie') is not none }}
        state: >-
          {{ (state_attr('sensor.chauffage_temperatures', 'temperatures') or {})
             .get('boulangerie') }}
      - name: "Chauffage cuisine température"
        unique_id: chauffage_cuisine_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >-
          {{ (state_attr('sensor.chauffage_temperatures', 'temperatures') or {})
             .get('cuisine') is not none }}
        state: >-
          {{ (state_attr('sensor.chauffage_temperatures', 'temperatures') or {})
             .get('cuisine') }}
      - name: "Chauffage salon température"
        unique_id: chauffage_salon_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        availability: >-
          {{ (state_attr('sensor.chauffage_temperatures', 'temperatures') or {})
             .get('salon') is not none }}
        state: >-
          {{ (state_attr('sensor.chauffage_temperatures', 'temperatures') or {})
             .get('salon') }}
      - name: "Chauffage chambre leo consigne"
        unique_id: chauffage_chambre_leo_consigne
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermostat
        availability: >-
          {{ (state_attr('sensor.chauffage_consignes', 'consignes') or {})
             .get('chambre_leo') is not none }}
        state: >-
          {{ (state_attr('sensor.chauffage_consignes', 'consignes') or {})
             .get('chambre_leo') }}
      - name: "Chauffage chambre pablo consigne"
        unique_id: chauffage_chambre_pablo_consigne
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermostat
        availability: >-
          {{ (state_attr('sensor.chauffage_consignes', 'consignes') or {})
             .get('chambre_pablo') is not none }}
        state: >-
          {{ (state_attr('sensor.chauffage_consignes', 'consignes') or {})
             .get('chambre_pablo') }}
      - name: "Chauffage sdb enfants consigne"
        unique_id: chauffage_sdb_enfants_consigne
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermostat
        availability: >-
          {{ (state_attr('sensor.chauffage_consignes', 'consignes') or {})
             .get('sdb_enfants') is not none }}
        state: >-
          {{ (state_attr('sensor.chauffage_consignes', 'consignes') or {})
             .get('sdb_enfants') }}
      - name: "Chauffage boulangerie consigne"
        unique_id: chauffage_boulangerie_consigne
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermostat
        availability: >-
          {{ (state_attr('sensor.chauffage_consignes', 'consignes') or {})
             .get('boulangerie') is not none }}
        state: >-
          {{ (state_attr('sensor.chauffage_consignes', 'consignes') or {})
             .get('boulangerie') }}
      - name: "Chauffage cuisine consigne"
        unique_id: chauffage_cuisine_consigne
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermostat
        availability: >-
          {{ (state_attr('sensor.chauffage_consignes', 'consignes') or {})
             .get('cuisine') is not none }}
        state: >-
          {{ (state_attr('sensor.chauffage_consignes', 'consignes') or {})
             .get('cuisine') }}
      - name: "Chauffage salon consigne"
        unique_id: chauffage_salon_consigne
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermostat
        availability: >-
          {{ (state_attr('sensor.chauffage_consignes', 'consignes') or {})
             .get('salon') is not none }}
        state: >-
          {{ (state_attr('sensor.chauffage_consignes', 'consignes') or {})
             .get('salon') }}

  ##############################################################################
  # 8 bis. LE CONTENU DES HORAIRES, pour l'afficher
  #
  # Une planification n'expose que son prochain changement (`next_event`), pas
  # sa grille de la semaine. On la demande donc par l'action
  # schedule.get_schedule, chaque minute, pour toutes les planifications du
  # chauffage ; une modification faite dans l'interface apparaît ainsi sur le
  # tableau de bord en moins d'une minute.
  #
  # La réponse donne, par jour, des plages `from` / `to` sous forme d'heures ;
  # on les ramène à du texte « HH:MM ». Une plage finissant à minuit est
  # stockée comme 23:59:59.999999 : on l'affiche « 24:00 ».
  ##############################################################################
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
    action:
      - variables:
          cibles: >-
            {{ states.schedule | map(attribute='entity_id')
               | select('match', 'schedule.(chauffage|clim)') | list }}
      - service: schedule.get_schedule
        target:
          entity_id: "{{ cibles }}"
        response_variable: reponse
    sensor:
      - name: "Chauffage horaires"
        unique_id: chauffage_horaires
        icon: mdi:calendar-week
        state: "{{ (reponse or {}) | count }}"
        attributes:
          grilles: >-
            {% set g = namespace(d={}) %}
            {% for e, jours in (reponse or {}).items() %}
              {% set nj = namespace(d={}) %}
              {% for j in ['monday', 'tuesday', 'wednesday', 'thursday',
                           'friday', 'saturday', 'sunday'] %}
                {% set nl = namespace(l=[]) %}
                {% for r in jours.get(j, []) %}
                  {% set fin = r['to'] | string %}
                  {% set donnees = r.get('data') or {} %}
                  {% set nl.l = nl.l + [{'de': (r['from'] | string)[:5],
                                         'a': '24:00' if '.999' in fin else fin[:5],
                                         't': donnees.get('temperature',
                                                          donnees.get('consigne'))}] %}
                {% endfor %}
                {% set nj.d = dict(nj.d.items() | list + [(j, nl.l)]) %}
              {% endfor %}
              {% set g.d = dict(g.d.items() | list + [(e, nj.d)]) %}
            {% endfor %}
            {{ g.d }}

################################################################################
# 9. HORAIRE — semaines impaires et présence
# Modifiable ensuite dans l'interface : Paramètres > Appareils et services >
# Entrées > Planifications.
################################################################################
schedule:
  chauffage:
    name: "Chauffage - horaire par défaut (non modifiable)"
    icon: mdi:calendar-clock
    monday: &semaine
      - from: "06:00:00"
        to: "08:30:00"
      - from: "16:30:00"
        to: "22:00:00"
    tuesday: *semaine
    wednesday: *semaine
    thursday: *semaine
    friday:
      - from: "06:00:00"
        to: "08:30:00"
      - from: "16:30:00"
        to: "23:00:00"
    saturday: &weekend
      - from: "08:00:00"
        to: "23:00:00"
    sunday:
      - from: "08:00:00"
        to: "22:00:00"

################################################################################
# 10. COMMANDES — présence, confort par pièce, mode de garde
################################################################################
input_boolean:
  chauffage_chambre_leo_arret:
