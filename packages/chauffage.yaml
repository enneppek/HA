################################################################################
# CHAUFFAGE — pilotage par présence, parité de semaine et horaire
#
# Principe : toute la logique est centralisée dans sensor.chauffage_consignes,
# qui calcule une température cible par pièce. Les automatisations ne font
# qu'appliquer ce calcul aux vannes. Pour modifier le comportement, il suffit
# donc de toucher au bloc de configuration ci-dessous.
#
# >>> LES IDENTIFIANTS D'ENTITÉS SONT DES SUPPOSITIONS <<<
# Remplacer ceux du bloc `pieces` par les vrais (voir outils/export_entites.jinja).
################################################################################

################################################################################
# 1. CONFIGURATION DES PIÈCES — le seul bloc à adapter
################################################################################
template:
  - sensor:
      - name: "Chauffage configuration"
        unique_id: chauffage_configuration
        icon: mdi:home-thermometer
        state: >-
          {{ state_attr('sensor.chauffage_configuration', 'pieces') | count
             if state_attr('sensor.chauffage_configuration', 'pieces') else 5 }}
        attributes:
          pieces: >-
            {# Entités relevées sur l'instance le 24/09/2026.

               `sonde` à `none` : la pièce n'a pas de sonde d'ambiance. La
               température est alors reprise des sondes internes des vannes,
               moins fiables (collées au radiateur) mais suffisantes pour
               décider s'il faut appeler la chaudière.

               La boulangerie a en plus un poêle à bois. Rien à prévoir :
               quand il tourne, la pièce dépasse sa consigne, cesse de
               réclamer, et sa vanne se ferme d'elle-même. #}
            {{
              {
                'chambre_leo': {
                  'nom': 'Chambre Léo',
                  'vannes': ['climate.vanne_thermo_leo_thermostat'],
                  'entrees_externes': ['number.vanne_thermo_leo_valeur_du_capteur_de_temperature_externe'],
                  'sonde': 'sensor.sonoff_t_hr_2_temperature',
                  'humidite': 'sensor.sonoff_t_hr_2_humidite',
                  'occupants': ['leo'],
                  'clim': none,
                  'confort': 19.5, 'nuit': 17.0, 'absence': 15.0
                },
                'chambre_pablo': {
                  'nom': 'Chambre Pablo',
                  'vannes': ['climate.vt_thermostat'],
                  'entrees_externes': ['number.vt_valeur_du_capteur_de_temperature_externe'],
                  'sonde': 'sensor.t_hr_temperature',
                  'humidite': 'sensor.t_hr_humidite',
                  'occupants': ['pablo'],
                  'clim': none,
                  'confort': 19.5, 'nuit': 17.0, 'absence': 15.0
                },
                'sdb_enfants': {
                  'nom': 'Salle de bains enfants',
                  'vannes': ['climate.sonoff_trvzb_thermostat'],
                  'entrees_externes': ['number.sonoff_trvzb_valeur_du_capteur_de_temperature_externe'],
                  'sonde': none,
                  'humidite': none,
                  'occupants': ['leo', 'pablo'],
                  'clim': none,
                  'confort': 21.0, 'nuit': 18.0, 'absence': 15.0
                },
                'chambre_laurent': {
                  'nom': 'Chambre Lolo',
                  'vannes': [],
                  'entrees_externes': [],
                  'sonde': 'sensor.sonoff_snzb_02d_temperature',
                  'humidite': 'sensor.sonoff_snzb_02d_humidite',
                  'occupants': ['laurent'],
                  'clim': 'climate.clim_chambre',
                  'confort': 19.5, 'nuit': 17.0, 'absence': 15.0
                },
                'boulangerie': {
                  'nom': 'Boulangerie',
                  'vannes': ['climate.vt_boulangerie_thermostat'],
                  'entrees_externes': ['number.vt_boulangerie_valeur_du_capteur_de_temperature_externe'],
                  'sonde': none,
                  'humidite': none,
                  'occupants': ['laurent'],
                  'clim': none,
                  'confort': 19.0, 'nuit': 16.0, 'absence': 15.0
                },
                'cuisine': {
                  'nom': 'Cuisine',
                  'vannes': ['climate.vtherrmo_cuisine_1_thermostat',
                             'climate.vt_cuisine_couloir_thermostat'],
                  'entrees_externes': ['number.vtherrmo_cuisine_1_valeur_du_capteur_de_temperature_externe',
                                       'number.vt_cuisine_couloir_valeur_du_capteur_de_temperature_externe'],
                  'sonde': 'sensor.thermostat_thermostat_indoor_temperature',
                  'humidite': none,
                  'occupants': ['leo', 'pablo', 'laurent'],
                  'clim': none,
                  'confort': 19.0, 'nuit': 16.5, 'absence': 15.0
                },
                'salon': {
                  'nom': 'Salon',
                  'vannes': ['climate.vt_salon_aquarium_thermostat',
                             'climate.vt_salon_canape_thermostat'],
                  'entrees_externes': ['number.vt_salon_aquarium_valeur_du_capteur_de_temperature_externe',
                                       'number.vt_salon_canape_valeur_du_capteur_de_temperature_externe'],
                  'sonde': none,
                  'humidite': none,
                  'occupants': ['leo', 'pablo', 'laurent'],
                  'clim': none,
                  'confort': 20.5, 'nuit': 17.5, 'absence': 15.0
                }
              }
            }}

  ##############################################################################
  # 2. TEMPÉRATURE DE CHAQUE PIÈCE
  #
  # Toutes les pièces n'ont pas de sonde d'ambiance. À défaut, on reprend la
  # moyenne des sondes internes de ses vannes : elles lisent au ras du
  # radiateur, donc trop chaud, mais suffisent à décider d'appeler ou non la
  # chaudière. Une pièce sans aucune mesure vaut `none`, et sera traitée plus
  # loin comme n'ayant pas besoin de chaleur — mieux vaut ne pas chauffer à
  # l'aveugle que de faire tourner le brûleur sans savoir.
  ##############################################################################
  - sensor:
      - name: "Chauffage températures"
        unique_id: chauffage_temperatures
        icon: mdi:thermometer-lines
        state: >-
          {% set t = state_attr('sensor.chauffage_temperatures', 'temperatures') or {} %}
          {{ t.values() | reject('none') | list | count }}
        attributes:
          temperatures: >-
            {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
            {% set nd = namespace(d={}) %}
            {% for p, c in cfg.items() %}
              {% set directe = states(c.sonde) if c.sonde else 'unknown' %}
              {% if directe not in ['unknown', 'unavailable', 'none', ''] %}
                {% set t = directe | float(default=none) %}
              {% else %}
                {% set ns = namespace(lues=[]) %}
                {% for v in c.vannes %}
                  {% set lue = state_attr(v, 'current_temperature') %}
                  {% if lue is not none %}
                    {% set ns.lues = ns.lues + [lue | float(default=0)] %}
                  {% endif %}
                {% endfor %}
                {% set t = ((ns.lues | sum) / (ns.lues | count)) | round(1)
                           if ns.lues | count > 0 else none %}
              {% endif %}
              {% set nd.d = dict(nd.d.items() | list + [(p, t)]) %}
            {% endfor %}
            {{ nd.d }}
          origine: >-
            {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
            {% set nd = namespace(d={}) %}
            {% for p, c in cfg.items() %}
              {% set directe = states(c.sonde) if c.sonde else 'unknown' %}
              {% set o = 'sonde' if directe not in ['unknown', 'unavailable', 'none', '']
                         else ('vannes' if c.vannes | count > 0 else 'aucune') %}
              {% set nd.d = dict(nd.d.items() | list + [(p, o)]) %}
            {% endfor %}
            {{ nd.d }}

  ##############################################################################
  # 3. CALCUL DES CONSIGNES — cœur de la logique
  #
  # Priorité, de la plus forte à la plus faible :
  #   1. Bouton confort de la pièce pressé      -> température de confort
  #   2. Un occupant présent + horaire actif    -> température de confort
  #   3. Un occupant présent, hors horaire      -> température de nuit
  #   4. Aucun occupant présent                 -> température d'absence (15°)
  ##############################################################################
  - sensor:
      - name: "Chauffage consignes"
        unique_id: chauffage_consignes
        unit_of_measurement: "°C"
        state: >-
          {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
          {% set ns = namespace(presents=[]) %}
          {% for q in ['leo', 'pablo', 'laurent'] %}
            {% if is_state('input_boolean.presence_' ~ q, 'on') %}
              {% set ns.presents = ns.presents + [q] %}
            {% endif %}
          {% endfor %}
          {% set horaire = is_state('schedule.chauffage', 'on') %}
          {% set nt = namespace(maxi=0) %}
          {% for p, c in cfg.items() %}
            {% set occupe = c.occupants | select('in', ns.presents) | list | count > 0 %}
            {% set boost = is_state('input_boolean.confort_' ~ p, 'on') %}
            {% set t = c.confort if (boost or (occupe and horaire))
                       else (c.nuit if occupe else c.absence) %}
            {% if t | float > nt.maxi %}{% set nt.maxi = t | float %}{% endif %}
          {% endfor %}
          {{ nt.maxi }}
        attributes:
          consignes: >-
            {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
            {% set ns = namespace(presents=[]) %}
            {% for q in ['leo', 'pablo', 'laurent'] %}
              {% if is_state('input_boolean.presence_' ~ q, 'on') %}
                {% set ns.presents = ns.presents + [q] %}
              {% endif %}
            {% endfor %}
            {% set horaire = is_state('schedule.chauffage', 'on') %}
            {% set nd = namespace(d={}) %}
            {% for p, c in cfg.items() %}
              {% set occupe = c.occupants | select('in', ns.presents) | list | count > 0 %}
              {% set boost = is_state('input_boolean.confort_' ~ p, 'on') %}
              {% set t = c.confort if (boost or (occupe and horaire))
                         else (c.nuit if occupe else c.absence) %}
              {% set nd.d = dict(nd.d.items() | list + [(p, t | float)]) %}
            {% endfor %}
            {{ nd.d }}
          horaire_actif: "{{ is_state('schedule.chauffage', 'on') }}"
          semaine_numero: "{{ now().isocalendar()[1] }}"
          semaine_paire: "{{ now().isocalendar()[1] % 2 == 0 }}"

  ##############################################################################
  # 4. TEMPÉRATURE EXTÉRIEURE
  # Arbitre le recours à la clim en chauffage : une pompe à chaleur perd son
  # avantage sur le mazout quand il gèle. Repli sur l'entité météo si aucune
  # sonde extérieure n'est disponible.
  ##############################################################################
  - sensor:
      - name: "Chauffage température extérieure"
        unique_id: chauffage_temperature_exterieure
        unit_of_measurement: "°C"
        device_class: temperature
        state: >-
          {# Le Lyric T6 et la clim fournissent chacun une mesure extérieure.
             Le T6 d'abord, la clim ensuite, la météo en dernier recours. #}
          {% set sources = ['sensor.thermostat_thermostat_outdoor_temperature',
                            'sensor.clim_chambre_outside_temperature'] %}
          {% set ns = namespace(t=none) %}
          {% for s in sources if ns.t is none %}
            {% if states(s) not in ['unknown', 'unavailable', 'none', ''] %}
              {% set ns.t = states(s) | float(default=none) %}
            {% endif %}
          {% endfor %}
          {{ ns.t if ns.t is not none
             else state_attr('weather.forecast_maison', 'temperature')
                  | float(default=10) }}

  ##############################################################################
  # 5. ARBITRAGE — qui délivre la chaleur dans chaque pièce ?
  #
  # Règle : la clim ne prend une pièce en charge que si elle y est installée,
  # que l'appoint est autorisé, qu'il ne fait pas trop froid dehors pour que
  # la PAC reste rentable, et que la pièce réclame effectivement.
  # Sinon, radiateur. Deux sources de chaleur simultanées gaspilleraient.
  ##############################################################################
  - sensor:
      - name: "Chauffage relais"
        unique_id: chauffage_relais
        icon: mdi:call-split
        state: >-
          {% set r = state_attr('sensor.chauffage_relais', 'relais') or {} %}
          {{ r.values() | select('eq', 'clim') | list | count }}
        attributes:
          relais: >-
            {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
            {% set consignes = state_attr('sensor.chauffage_consignes', 'consignes') or {} %}
            {% set text = states('sensor.chauffage_temperature_exterieure')
                          | float(default=10) %}
            {% set seuil = states('input_number.clim_seuil_pac') | float(default=5) %}
            {% set autorise = is_state('input_boolean.clim_auto_chaud', 'on') %}
            {% set temps = state_attr('sensor.chauffage_temperatures', 'temperatures') or {} %}
            {% set nd = namespace(d={}) %}
            {% for p, c in cfg.items() %}
              {% set mesure = temps.get(p) | float(default=99) %}
              {% set cible = consignes.get(p, 0) | float(default=0) %}
              {% set demande = mesure < (cible - 0.3) %}
              {# Sans radiateur, la clim assure la pièce en toute saison :
                 le seuil de rentabilité de la PAC ne s'applique pas, il n'y a
                 pas d'alternative. #}
              {% set sans_radiateur = c.vannes | count == 0 %}
              {% set v = 'clim' if (c.clim and (sans_radiateur
                                    or (autorise and text >= seuil and demande)))
                         else 'radiateur' %}
              {% set nd.d = dict(nd.d.items() | list + [(p, v)]) %}
            {% endfor %}
            {{ nd.d }}

  ##############################################################################
  # 6. DEMANDE CHAUDIÈRE
  # Vrai dès qu'une pièce accuse un déficit > 0.3 °C. Le delay_off de 10 min
  # évite que la chaudière ne cycle en courts créneaux.
  ##############################################################################
  - binary_sensor:
      - name: "Chauffage demande chaudière"
        unique_id: chauffage_demande_chaudiere
        device_class: heat
        delay_off: "00:10:00"
        state: >-
          {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
          {% set consignes = state_attr('sensor.chauffage_consignes', 'consignes') or {} %}
          {% set relais = state_attr('sensor.chauffage_relais', 'relais') or {} %}
          {% set temps = state_attr('sensor.chauffage_temperatures', 'temperatures') or {} %}
          {% set ns = namespace(demande=false) %}
          {% for p, c in cfg.items() %}
            {% set mesure = temps.get(p) | float(default=99) %}
            {% set cible = consignes.get(p, 0) | float(default=0) %}
            {% if mesure < (cible - 0.3)
                  and relais.get(p, 'radiateur') == 'radiateur' %}
              {% set ns.demande = true %}
            {% endif %}
          {% endfor %}
          {{ ns.demande }}
        attributes:
          deficit_max: >-
            {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
            {% set consignes = state_attr('sensor.chauffage_consignes', 'consignes') or {} %}
            {% set temps = state_attr('sensor.chauffage_temperatures', 'temperatures') or {} %}
            {% set ns = namespace(d=0) %}
            {% for p, c in cfg.items() %}
              {% set ecart = (consignes.get(p, 0) | float(default=0))
                             - (temps.get(p) | float(default=99)) %}
              {% if ecart > ns.d %}{% set ns.d = ecart %}{% endif %}
            {% endfor %}
            {{ ns.d | round(1) }}

  ##############################################################################
  # 7. CONSIGNE ENVOYÉE AU LYRIC T6
  #
  # Le T6 n'est plus un thermostat mais un interrupteur : soit on le pousse
  # assez haut pour qu'il appelle le brûleur, soit assez bas pour qu'il le
  # relâche. Ce sont les vannes, pièce par pièce, qui règlent réellement les
  # températures.
  ##############################################################################
  - sensor:
      - name: "Chauffage consigne chaudière"
        unique_id: chauffage_consigne_chaudiere
        unit_of_measurement: "°C"
        device_class: temperature
        state: >-
          {{ states('input_number.chaudiere_consigne_marche') | float(default=24)
             if is_state('binary_sensor.chauffage_demande_chaudiere', 'on')
             else states('input_number.chaudiere_consigne_arret') | float(default=10) }}

################################################################################
# 8. HORAIRE — semaines impaires et présence
# Modifiable ensuite dans l'interface : Paramètres > Appareils et services >
# Entrées > Planifications.
################################################################################
schedule:
  chauffage:
    name: "Chauffage - horaire"
    icon: mdi:calendar-clock
    monday: &semaine
      - from: "06:00:00"
        to: "08:30:00"
      - from: "16:30:00"
        to: "22:00:00"
    tuesday: *semaine
    wednesday: *semaine
    thursday: *semaine
    friday:
      - from: "06:00:00"
        to: "08:30:00"
      - from: "16:30:00"
        to: "23:00:00"
    saturday: &weekend
      - from: "08:00:00"
        to: "23:00:00"
    sunday:
      - from: "08:00:00"
        to: "22:00:00"

################################################################################
# 9. COMMANDES — présence, confort par pièce, mode de garde
################################################################################
input_boolean:
  presence_leo:
    name: "Léo"
    icon: mdi:account
  presence_pablo:
    name: "Pablo"
    icon: mdi:account
  presence_laurent:
    name: "Laurent"
    icon: mdi:account

  confort_chambre_leo:
    name: "Confort - Chambre Léo"
    icon: mdi:sofa
  confort_chambre_pablo:
    name: "Confort - Chambre Pablo"
    icon: mdi:sofa
  confort_sdb_enfants:
    name: "Confort - Salle de bains enfants"
    icon: mdi:shower
  confort_chambre_laurent:
    name: "Confort - Chambre Laurent"
    icon: mdi:sofa
  confort_boulangerie:
    name: "Confort - Boulangerie"
    icon: mdi:bread-slice

  confort_cuisine:
    name: "Confort - Cuisine"
    icon: mdi:silverware-fork-knife

  confort_salon:
    name: "Confort - Salon"
    icon: mdi:sofa

input_select:
  garde_enfants:
    name: "Garde des enfants"
    icon: mdi:calendar-account
    options:
      - "Automatique (parité)"
      - "Présents"
      - "Absents"
    initial: "Automatique (parité)"

input_number:
  # Le Lyric T6 est installé dans la CUISINE. Tel quel, il régule sur la
  # température de cette seule pièce et coupe le brûleur dès qu'elle est
  # satisfaite — privant de chaleur toute la maison. On le détourne donc en
  # relais marche/arrêt : Home Assistant décide, le T6 exécute.
  #
  # Consigne de marche : assez haute pour que le T6 réclame toujours quand
  # HA le veut, mais PAS au maximum. Si Home Assistant tombe en panne, le T6
  # reste sur cette valeur : elle borne alors la température de la cuisine.
  #
  # 24 °C laisse environ 5 °C de marge au-dessus de la consigne de la cuisine.
  # Contrepartie : une cuisson qui pousse la pièce au-delà de 24 °C fera
  # relâcher le brûleur le temps qu'elle redescende. Si cela se produit
  # souvent, relever cette valeur.
  chaudiere_consigne_marche:
    name: "Chaudière - consigne d'appel"
    icon: mdi:fire
    min: 22
    max: 32
    step: 0.5
    unit_of_measurement: "°C"
    initial: 24

  chaudiere_consigne_arret:
    name: "Chaudière - consigne de repos"
    icon: mdi:fire-off
    min: 5
    max: 16
    step: 0.5
    unit_of_measurement: "°C"
    initial: 10

  duree_confort:
    name: "Durée d'un appui confort"
    icon: mdi:timer-sand
    min: 30
    max: 480
    step: 30
    unit_of_measurement: min
    initial: 120

################################################################################
# 10. AUTOMATISATIONS
################################################################################
automation:
  ##############################################################################
  # Applique les consignes calculées aux vannes Sonoff.
  # Déclenchée par les entrées plutôt que par le capteur : un changement
  # d'attribut ne déclenche pas de façon fiable.
  ##############################################################################
  - id: chauffage_application_consignes
    alias: "Chauffage - appliquer les consignes"
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_boolean.presence_leo
          - input_boolean.presence_pablo
          - input_boolean.presence_laurent
          - input_boolean.confort_chambre_leo
          - input_boolean.confort_chambre_pablo
          - input_boolean.confort_sdb_enfants
          - input_boolean.confort_chambre_laurent
          - input_boolean.confort_boulangerie
          - input_boolean.confort_boulangerie
          - input_boolean.confort_cuisine
          - input_boolean.confort_salon
          - schedule.chauffage
      - platform: time_pattern
        minutes: "/15"          # resynchronisation : une vanne peut rater un ordre Zigbee
      - platform: homeassistant
        event: start
    action:
      - delay: "00:00:05"       # laisse le capteur de consignes se recalculer
      - repeat:
          for_each: >-
            {{ (state_attr('sensor.chauffage_configuration', 'pieces') or {})
               | list }}
          sequence:
            - variables:
                piece: "{{ repeat.item }}"
                cfg: >-
                  {{ (state_attr('sensor.chauffage_configuration', 'pieces')
                      or {})[repeat.item] }}
                relais: >-
                  {{ (state_attr('sensor.chauffage_relais', 'relais')
                      or {}).get(repeat.item, 'radiateur') }}
                cible: >-
                  {% set c = (state_attr('sensor.chauffage_consignes', 'consignes')
                              or {}).get(repeat.item, 15) | float(default=15) %}
                  {% set cfg = (state_attr('sensor.chauffage_configuration', 'pieces')
                                or {})[repeat.item] %}
                  {# Si la clim chauffe la pièce, la vanne se referme pour ne pas
                     faire tourner la chaudière en double. #}
                  {{ cfg.absence | float(default=15)
                     if (state_attr('sensor.chauffage_relais', 'relais')
                         or {}).get(repeat.item, 'radiateur') == 'clim'
                     else c }}
            # Boucle imbriquée : une pièce peut porter plusieurs vannes,
            # qui reçoivent toutes la même consigne. `piece` et `cible` sont
            # capturés au-dessus, car `repeat.item` va être redéfini ici.
            - repeat:
                for_each: "{{ cfg.vannes }}"
                sequence:
                  - variables:
                      vanne: "{{ repeat.item }}"
                  # `if/then` et non `condition:` : une condition qui échoue
                  # interromprait la boucle entière, pas la seule itération.
                  - if:
                      - condition: template
                        value_template: >-
                          {{ states(vanne) not in ['unknown', 'unavailable']
                             and (state_attr(vanne, 'temperature')
                                  | float(default=-99) - cible) | abs > 0.2 }}
                    then:
                      # La vanne doit chauffer : 15° tient lieu de hors-gel.
                      - if:
                          - condition: template
                            value_template: "{{ states(vanne) == 'off' }}"
                        then:
                          - service: climate.set_hvac_mode
                            target:
                              entity_id: "{{ vanne }}"
                            data:
                              hvac_mode: heat
                      - service: climate.set_temperature
                        target:
                          entity_id: "{{ vanne }}"
                        data:
                          temperature: "{{ cible }}"

  ##############################################################################
  # Bascule de garde selon la parité de semaine.
  # Semaine PAIRE   -> enfants absents  -> chambres et SdB enfants à 15 °C
  # Semaine IMPAIRE -> enfants présents -> chauffage suivant l'horaire
  ##############################################################################
  - id: chauffage_bascule_garde
    alias: "Chauffage - bascule de semaine"
    mode: single
    trigger:
      - platform: time
        at: "00:05:00"
      - platform: state
        entity_id: input_select.garde_enfants
      - platform: homeassistant
        event: start
    action:
      - variables:
          presents: >-
            {% set mode = states('input_select.garde_enfants') %}
            {% if mode == 'Présents' %}true
            {% elif mode == 'Absents' %}false
            {% else %}{{ now().isocalendar()[1] % 2 == 1 }}{% endif %}
      - service: "input_boolean.turn_{{ 'on' if presents | bool else 'off' }}"
        target:
          entity_id:
            - input_boolean.presence_leo
            - input_boolean.presence_pablo

  ##############################################################################
  # Un appui confort s'éteint tout seul, pour ne pas chauffer une pièce vide
  # jusqu'au lendemain.
  ##############################################################################
  - id: chauffage_extinction_confort
    alias: "Chauffage - extinction automatique du confort"
    mode: parallel
    max: 10
    trigger:
      - platform: state
        entity_id:
          - input_boolean.confort_chambre_leo
          - input_boolean.confort_chambre_pablo
          - input_boolean.confort_sdb_enfants
          - input_boolean.confort_chambre_laurent
          - input_boolean.confort_cuisine
          - input_boolean.confort_salon
        to: "on"
    action:
      - delay:
          minutes: "{{ states('input_number.duree_confort') | int(default=120) }}"
      - service: input_boolean.turn_off
        target:
          entity_id: "{{ trigger.entity_id }}"

  ##############################################################################
  # Chaudière mazout via le Lyric T6, détourné en relais marche/arrêt.
  #
  # Le T6 étant dans la cuisine, le laisser réguler revenait à confier le
  # chauffage de toute la maison à la température d'une seule pièce — celle
  # qui chauffe le plus vite, cuisson comprise. On lui impose donc une
  # consigne d'appel qu'il ne peut atteindre tant que HA réclame, et une
  # consigne de repos sinon. Les températures réelles sont l'affaire des
  # vannes.
  ##############################################################################
  - id: chauffage_pilotage_chaudiere
    alias: "Chauffage - pilotage de la chaudière"
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.chauffage_demande_chaudiere
        to: ["on", "off"]
      - platform: state
        entity_id:
          - input_number.chaudiere_consigne_marche
          - input_number.chaudiere_consigne_arret
      - platform: time_pattern
        minutes: "/30"
      - platform: homeassistant
        event: start
    condition:
      - condition: template
        value_template: >-
          {{ states('climate.thermostat_thermostat') not in ['unknown', 'unavailable'] }}
    action:
      - variables:
          cible: >-
            {{ states('sensor.chauffage_consigne_chaudiere')
               | float(default=10) }}
      - condition: template
        value_template: >-
          {{ state_attr('climate.thermostat_thermostat', 'temperature') | float(default=-99)
             != cible | float }}
      - service: climate.set_temperature
        target:
          entity_id: climate.thermostat_thermostat
        data:
          temperature: "{{ cible }}"

  ##############################################################################
  # Injection de la température réelle dans les vannes.
  #
  # Une vanne régule sur sa sonde interne, collée au radiateur, donc trop
  # chaude : elle ferme avant que la pièce soit à température. Quand la pièce
  # dispose d'une vraie sonde d'ambiance, on la pousse dans l'entrée de
  # température externe de chacune de ses vannes.
  #
  # Les pièces sans sonde d'ambiance sont ignorées : il n'y aurait rien de
  # plus juste à leur injecter que ce qu'elles mesurent déjà.
  ##############################################################################
  - id: chauffage_sonde_externe
    alias: "Chauffage - injecter la température réelle dans les vannes"
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/10"
      - platform: homeassistant
        event: start
    action:
      - repeat:
          for_each: >-
            {{ (state_attr('sensor.chauffage_configuration', 'pieces') or {})
               | list }}
          sequence:
            - variables:
                cfg: >-
                  {{ (state_attr('sensor.chauffage_configuration', 'pieces')
                      or {})[repeat.item] }}
                mesure: >-
                  {{ (state_attr('sensor.chauffage_temperatures', 'temperatures')
                      or {}).get(repeat.item) }}
                origine: >-
                  {{ (state_attr('sensor.chauffage_temperatures', 'origine')
                      or {}).get(repeat.item, 'aucune') }}
            - if:
                - condition: template
                  value_template: >-
                    {{ origine == 'sonde' and mesure is not none
                       and cfg.entrees_externes | count > 0 }}
              then:
                - repeat:
                    for_each: "{{ cfg.entrees_externes }}"
                    sequence:
                      - if:
                          - condition: template
                            value_template: >-
                              {{ states(repeat.item)
                                 not in ['unknown', 'unavailable'] }}
                        then:
                          - service: number.set_value
                            target:
                              entity_id: "{{ repeat.item }}"
                            data:
                              value: "{{ mesure | float }}"
