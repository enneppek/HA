    icon: mdi:check-decagram

  chauffage_reglages_initialises:
    name: "Chauffage - réglages initialisés"
    icon: mdi:check-decagram

  presence_leo:
    name: "Léo"
    icon: mdi:account
  presence_pablo:
    name: "Pablo"
    icon: mdi:account
  presence_laurent:
    name: "Laurent"
    icon: mdi:account

  confort_chambre_leo:
    name: "Confort - Chambre Léo"
    icon: mdi:sofa
  confort_chambre_pablo:
    name: "Confort - Chambre Pablo"
    icon: mdi:sofa
  confort_sdb_enfants:
    name: "Confort - Salle de bains enfants"
    icon: mdi:shower
  confort_chambre_laurent:
    name: "Confort - Chambre Laurent"
    icon: mdi:sofa
  confort_boulangerie:
    name: "Confort - Boulangerie"
    icon: mdi:bread-slice

  confort_cuisine:
    name: "Confort - Cuisine"
    icon: mdi:silverware-fork-knife

  confort_salon:
    name: "Confort - Salon"
    icon: mdi:sofa

input_text:
  # Dérogations en cours : {pièce: [température réglée, consigne de base]}.
  chauffage_derogations:
    name: "Chauffage - réglages faits sur les vannes"
    icon: mdi:hand-back-right
    max: 255

script:
  chauffage_annuler_derogations:
    alias: "Chauffage - annuler les réglages faits sur les vannes"
    icon: mdi:undo-variant
    sequence:
      - service: input_text.set_value
        target:
          entity_id: input_text.chauffage_derogations
