            tap_action:
              action: more-info
            grid_options:
              columns: full
          - type: gauge
            entity: sensor.sonoff_snzb_02d_temperature
            name: Température
            min: 10
            max: 28
            needle: true
            segments:
              - from: 0
                color: "#4361ee"
              - from: 16
                color: "#4cc9f0"
              - from: 18
                color: "#43aa8b"
              - from: 22
                color: "#f8961e"
              - from: 24
                color: "#f94144"
            grid_options:
              columns: 6
          - type: gauge
            entity: sensor.sonoff_snzb_02d_humidite
            name: Humidité
            min: 20
            max: 90
            needle: true
            segments:
              - from: 0
                color: "#f8961e"
              - from: 35
                color: "#43aa8b"
              - from: 60
                color: "#f9c74f"
              - from: 65
                color: "#4361ee"
            grid_options:
              columns: 6
          # --- Assèchement à la demande ---------------------------------
