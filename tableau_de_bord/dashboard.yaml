# Tableau de bord « Chauffage », en mode YAML.
#
# Home Assistant le lit directement dans ce dépôt, cloné sous
# /config/claude-ha : aucun copier-coller dans l'interface. Après un
# `git pull`, il suffit de rafraîchir la page du navigateur.
# Déclaré dans configuration.yaml sous `lovelace: dashboards:` (voir README).
#
# Uniquement des cartes natives de Home Assistant : aucune extension à
# installer ni à maintenir. Les illustrations sont des SVG animés (animations
# CSS internes), servis depuis /config/www/chauffage/ sous /local/chauffage/ ;
# elles sont copiées là depuis tableau_de_bord/images/ (voir README).
#
# Pièges évités :
# - Les clés `on` / `off` de state_image sont entre guillemets : sans eux, le
#   YAML les lit comme des booléens et l'image ne change jamais.
# - Les sections markdown utilisent des blocs littéraux (`|`) : un bloc replié
#   (`>-`) fusionnerait les lignes et casserait tableaux et listes.
title: Chauffage
views:
  - title: Chauffage
    path: chauffage
    icon: mdi:radiator
    type: sections
    max_columns: 3
    badges:
      - type: entity
        entity: sensor.chauffage_temperature_exterieure
        name: Extérieur
        show_name: true
        icon: mdi:thermometer
      - type: entity
        entity: binary_sensor.chauffage_demande_chaudiere
        name: Chaudière
        show_name: true
      - type: entity
        entity: sensor.clim_role
        name: Clim
        show_name: true
      - type: entity
        entity: input_select.garde_enfants
        name: Garde
        show_name: true
    sections:
      # --- La maison : illustration animée et vue d'ensemble ---------------
      - type: grid
        cards:
          - type: heading
            heading: La maison
            icon: mdi:home-thermometer
          - type: picture-entity
            entity: binary_sensor.chauffage_demande_chaudiere
            name: Chaudière
            show_name: true
            show_state: true
            aspect_ratio: 37.5%
            image: /local/chauffage/maison_repos.svg?v=1
            state_image:
              "on": /local/chauffage/maison_chauffe.svg?v=1
              "off": /local/chauffage/maison_repos.svg?v=1
            tap_action:
              action: more-info
            grid_options:
              columns: full
          - type: markdown
            grid_options:
              columns: full
            content: |
              {% set c = state_attr('sensor.chauffage_consignes', 'consignes') or {} %}
              {% set h = state_attr('sensor.chauffage_consignes', 'horaires') or {} %}
              {% set t = state_attr('sensor.chauffage_temperatures', 'temperatures') or {} %}
              {% set o = state_attr('sensor.chauffage_temperatures', 'origine') or {} %}
              {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
              {% set r = state_attr('sensor.chauffage_relais', 'relais') or {} %}
              {% set dg = state_attr('sensor.chauffage_consignes', 'derogations') or [] %}
              | Pièce | Mesure | Consigne | Horaire |
              |:--|--:|--:|:--|
              {%- for p, cible in c.items() %}
              {%- set hp = h.get(p, 'schedule.chauffage') %}
              | {{ cfg.get(p, {}).get('nom', p) }} | {{ t.get(p) if t.get(p) is not none else '?' }} °C{{ ' \\*' if o.get(p) == 'vannes' else '' }} | {{ 'clim' if r.get(p) == 'clim' else '**' ~ cible ~ ' °C**' ~ (' ✋' if p in dg else '') ~ (' ⏸' if is_state('input_boolean.chauffage_' ~ p ~ '_actif', 'off') else '') }} | {{ '—' if r.get(p) == 'clim' else ('🟢' if is_state(hp, 'on') else '⚪') ~ (' ✎' if hp == 'schedule.chauffage_' ~ p else '') }} |
              {%- endfor %}

              🟢 dans l'horaire · ⚪ hors horaire (nuit) · ✎ horaire propre à la pièce ·
              ✋ réglée sur la vanne, jusqu'au prochain changement de plage ·
              ⏸ chauffage de la pièce coupé ·
              \* mesurée par les vannes, faute de sonde

          - type: tile
            entity: script.chauffage_annuler_derogations
            name: Annuler les réglages faits sur les vannes
            icon: mdi:undo-variant
            color: grey
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: script.chauffage_annuler_derogations
            grid_options:
              columns: full

      # --- Qui est à la maison ----------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Qui est à la maison ?
            icon: mdi:account-group
