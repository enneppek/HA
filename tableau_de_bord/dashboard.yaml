          # seuls états d'une planification existante (« on » / « off ») : une
          # entité absente ne vaut pas forcément « unavailable » à l'écran.
          - type: tile
            entity: schedule.chauffage_salon
            name: Horaire de la pièce
            icon: mdi:calendar-edit
            color: green
            visibility:
              - condition: state
                entity: schedule.chauffage_salon
                state:
                  - "on"
                  - "off"
            grid_options:
              columns: full

      # --- Chambre de Lolo : clim seule -------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Chambre Lolo
            icon: mdi:air-conditioner
            badges:
              - type: entity
                entity: sensor.clim_role
                show_icon: true
                show_state: true
                color: teal
          - type: picture-entity
            entity: sensor.clim_role
            name: Clim
            show_name: true
            show_state: true
            aspect_ratio: 50%
            image: /local/chauffage/clim_arret.svg?v=1
            state_image:
              "Chauffage": /local/chauffage/clim_chauffage.svg?v=1
              "Assèchement": /local/chauffage/clim_assechement.svg?v=1
              "Froid": /local/chauffage/clim_froid.svg?v=1
              "Arrêt": /local/chauffage/clim_arret.svg?v=1
              "Manuel": /local/chauffage/clim_chauffage.svg?v=1
            tap_action:
              action: more-info
              entity: climate.clim_chambre
            grid_options:
              columns: full
          # Commande directe, comme dans l'Aperçu. Home Assistant ne défait
          # pas ce qui est réglé ici : il n'éteint que ce qu'il a allumé.
          - type: thermostat
            entity: climate.clim_chambre
            name: Clim chambre
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - "off"
                  - heat_cool
                  - cool
                  - dry
                  - fan_only
                  - heat
            grid_options:
              columns: full
          - type: gauge
            entity: sensor.sonoff_snzb_02d_temperature
            name: Température
            min: 10
            max: 28
            needle: true
            segments:
              - from: 0
                color: "#4361ee"
              - from: 16
                color: "#4cc9f0"
              - from: 18
                color: "#43aa8b"
              - from: 22
                color: "#f8961e"
              - from: 24
                color: "#f94144"
            grid_options:
              columns: 6
          - type: gauge
            entity: sensor.sonoff_snzb_02d_humidite
            name: Humidité
            min: 20
            max: 90
            needle: true
            segments:
              - from: 0
                color: "#f8961e"
              - from: 35
                color: "#43aa8b"
              - from: 60
                color: "#f9c74f"
              - from: 65
                color: "#4361ee"
            grid_options:
              columns: 6
          # --- Assèchement à la demande ---------------------------------
          - type: tile
            entity: input_boolean.clim_assechement
            name: Assécher la chambre
            icon: mdi:water-off
            color: teal
            vertical: true
            tap_action:
              action: toggle
            grid_options:
              columns: 6
              rows: 2
          - type: tile
            entity: input_select.clim_duree_assechement
            name: Durée
            icon: mdi:timer-outline
            color: teal
            features_position: bottom
            features:
              - type: select-options
            grid_options:
              columns: 6
              rows: 2
          # N'apparaît que pendant un assèchement, avec son heure de fin.
          - type: markdown
            visibility:
              - condition: state
                entity: input_boolean.clim_assechement
                state: "on"
            grid_options:
              columns: full
            content: |
              {% set debut = as_timestamp(states.input_boolean.clim_assechement.last_changed) %}
              {% set heures = states('input_select.clim_duree_assechement') | replace(' h', '') | int(default=1) %}
              💧 **Assèchement en cours** : clim en chauffage à 24 °C
              jusqu'à **{{ (debut + heures * 3600) | timestamp_custom('%H:%M') }}**.
              Appuie de nouveau sur « Assécher la chambre » pour arrêter avant.
          # --- Horaire de la clim ----------------------------------------
          - type: tile
            entity: schedule.clim_chambre
            name: Horaire de la clim
            icon: mdi:calendar-clock
            color: green
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.clim_consigne_horaire
            name: Consigne horaire
            icon: mdi:thermometer
            color: deep-orange
            features_position: bottom
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 6
          # --- Minimum ---------------------------------------------------
          - type: tile
            entity: input_number.clim_temp_min
            name: Température minimale
            icon: mdi:thermometer-chevron-down
            color: deep-orange
            features_position: bottom
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.clim_maintien_temp_min
            name: Maintenir le minimum
            icon: mdi:shield-sun
            color: deep-orange
            tap_action:
              action: toggle
            grid_options:
              columns: 6
          - type: markdown
            grid_options:
              columns: full
            content: |
              Pilote la clim librement : ici, à la télécommande ou dans l'appli.
              Home Assistant n'intervient que pour l'**assèchement**, l'**horaire**
              (si tu es là) et le **minimum** ; il n'éteint que ce qu'il a allumé.
              Si tu la règles pendant l'horaire, il te la laisse jusqu'à la fin
              de la plage. Pour créer l'horaire : planification nommée
              `Clim chambre`.

      # --- Courbes ----------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Températures sur 24 h
            icon: mdi:chart-line
          - type: history-graph
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.chauffage_chambre_leo_temperature
                name: Chambre Léo
              - entity: sensor.chauffage_chambre_pablo_temperature
                name: Chambre Pablo
              - entity: sensor.chauffage_sdb_enfants_temperature
                name: Salle de bains enfants
              - entity: sensor.chauffage_chambre_laurent_temperature
                name: Chambre Lolo
              - entity: sensor.chauffage_boulangerie_temperature
                name: Boulangerie
              - entity: sensor.chauffage_cuisine_temperature
                name: Cuisine
              - entity: sensor.chauffage_salon_temperature
                name: Salon

      # --- Chaudière --------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Chaudière
            icon: mdi:fire
          - type: tile
            entity: binary_sensor.chauffage_demande_chaudiere
            name: Demande en cours
            icon: mdi:fire
            color: deep-orange
            grid_options:
              columns: full
          - type: tile
            entity: sensor.chauffage_consigne_chaudiere
            name: Consigne envoyée
            icon: mdi:thermostat
            color: deep-orange
            grid_options:
              columns: 6
          - type: tile
            entity: climate.thermostat_thermostat
            name: Lyric T6
            icon: mdi:thermostat-box
            color: deep-orange
            grid_options:
              columns: 6

      # --- Réglages ---------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Réglages
            icon: mdi:tune
          - type: entities
            grid_options:
              columns: full
            entities:
              - entity: input_number.chauffage_nuit
                name: Température de nuit (toutes les pièces)
              - entity: input_number.duree_confort
                name: Durée du confort immédiat
              - entity: schedule.chauffage
                name: Horaire de secours (non modifiable)
              - type: divider
              - entity: input_number.chaudiere_consigne_marche
                name: Chaudière - consigne d'appel
              - entity: input_number.chaudiere_consigne_arret
                name: Chaudière - consigne de repos
              - type: divider
              - entity: input_boolean.clim_auto_froid
                name: Clim - rafraîchissement l'été
              - entity: input_boolean.clim_auto_chaud
                name: Clim - appoint chauffage
              - entity: input_number.clim_seuil_froid
                name: Clim - déclenchement du froid
              - entity: input_number.clim_consigne_ete
                name: Clim - consigne d'été
              - entity: input_number.clim_seuil_pac
                name: Clim - extérieur mini pour l'appoint
