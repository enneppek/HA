          - type: heading
            heading: Chambre Lolo
            icon: mdi:air-conditioner
            badges:
              - type: entity
                entity: sensor.clim_role
                show_icon: true
                show_state: true
                color: teal
          - type: picture-entity
            entity: sensor.clim_role
            name: Clim
            show_name: true
            show_state: true
            aspect_ratio: 50%
            image: /local/chauffage/clim_arret.svg?v=1
            state_image:
              "Chauffage": /local/chauffage/clim_chauffage.svg?v=1
              "Assèchement": /local/chauffage/clim_assechement.svg?v=1
              "Froid": /local/chauffage/clim_froid.svg?v=1
              "Arrêt": /local/chauffage/clim_arret.svg?v=1
