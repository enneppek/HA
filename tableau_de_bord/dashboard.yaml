              - from: 16
                color: "#4cc9f0"
              - from: 18
                color: "#43aa8b"
              - from: 22
                color: "#f8961e"
              - from: 24
                color: "#f94144"
            grid_options:
              columns: 6
              rows: 3
          - type: tile
            entity: input_boolean.confort_chambre_leo
            name: Confort immédiat
            icon: mdi:fire-circle
            color: deep-orange
            vertical: true
            tap_action:
              action: toggle
            grid_options:
              columns: 6
              rows: 3
          - type: tile
            entity: input_number.chauffage_chambre_leo_confort
            name: Confort
            icon: mdi:sofa
            color: amber
            features_position: bottom
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 6
          - type: tile
            entity: input_number.chauffage_chambre_leo_nuit
