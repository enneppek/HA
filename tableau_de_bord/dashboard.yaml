      # --- Horaires ---------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Horaires
            icon: mdi:calendar-clock
          - type: tile
            entity: schedule.chauffage_commun
            name: Horaire commun
            icon: mdi:calendar-week
            color: green
            grid_options:
              columns: full
          - type: markdown
            grid_options:
              columns: full
            content: |
              Clique sur l'horaire commun, puis sur ⚙️, pour le dessiner jour par jour.
              Une pièce peut avoir **ses propres heures** : crée une planification
              portant exactement le nom ci-dessous, elle sera suivie d'elle-même.

              | Pièce | Nom à saisir |
              |:--|:--|
              | Toute la maison | `Chauffage commun` |
              | Chambre Léo | `Chauffage chambre leo` |
              | Chambre Pablo | `Chauffage chambre pablo` |
              | Salle de bains enfants | `Chauffage sdb enfants` |
              | Chambre Lolo | `Chauffage chambre laurent` |
              | Boulangerie | `Chauffage boulangerie` |
              | Cuisine | `Chauffage cuisine` |
              | Salon | `Chauffage salon` |
          # Bouton sans entité : il doit rester cliquable avant même que
          # l'horaire commun n'existe, puisqu'il sert à le créer.
          - type: button
            name: Créer ou modifier les planifications
            icon: mdi:calendar-edit
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /config/helpers
            grid_options:
              columns: full

      - type: grid
