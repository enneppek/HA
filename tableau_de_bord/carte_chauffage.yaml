################################################################################
# Carte "Chauffage"
#
# Pose : tableau de bord > crayon (en haut à droite) > + Ajouter une carte >
# Manuel, puis coller ce contenu.
################################################################################
type: vertical-stack
cards:
  - type: markdown
    content: >-
      ## Chauffage

      Semaine {{ state_attr('sensor.chauffage_consignes', 'semaine_numero') }}
      ({{ 'paire — enfants absents' if
      state_attr('sensor.chauffage_consignes', 'semaine_paire')
      else 'impaire — enfants présents' }}) ·
      {{ 'horaire actif' if
      state_attr('sensor.chauffage_consignes', 'horaire_actif')
      else 'hors horaire' }}
      {% if is_state('binary_sensor.chauffage_demande_chaudiere', 'on') %}

      🔥 **Chaudière en demande** (déficit
      {{ state_attr('binary_sensor.chauffage_demande_chaudiere', 'deficit_max') }} °C)
      {% else %}

      ⏸️ Chaudière à l'arrêt
      {% endif %}

  # --- Qui est à la maison -----------------------------------------------
  - type: grid
    columns: 3
    square: false
    cards:
      - type: button
        entity: input_boolean.presence_leo
        name: Léo
        icon: mdi:account
        tap_action:
          action: toggle
        show_state: true
      - type: button
        entity: input_boolean.presence_pablo
        name: Pablo
        icon: mdi:account
        tap_action:
          action: toggle
        show_state: true
      - type: button
        entity: input_boolean.presence_laurent
        name: Laurent
        icon: mdi:account
        tap_action:
          action: toggle
        show_state: true

  # --- Confort par pièce -------------------------------------------------
  # L'appui force la température de confort, puis s'annule tout seul au bout
  # de la durée réglée plus bas.
  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        entity: input_boolean.confort_chambre_leo
        name: Chambre Léo
        icon: mdi:bed
        tap_action:
          action: toggle
      - type: button
        entity: input_boolean.confort_chambre_pablo
        name: Chambre Pablo
        icon: mdi:bed
        tap_action:
          action: toggle
      - type: button
        entity: input_boolean.confort_sdb_enfants
        name: SdB enfants
        icon: mdi:shower
        tap_action:
          action: toggle
      - type: button
        entity: input_boolean.confort_chambre_laurent
        name: Chambre Lolo
        icon: mdi:bed
        tap_action:
          action: toggle
      - type: button
        entity: input_boolean.confort_boulangerie
        name: Boulangerie
        icon: mdi:bread-slice
        tap_action:
          action: toggle
      - type: button
        entity: input_boolean.confort_cuisine
        name: Cuisine
        icon: mdi:silverware-fork-knife
        tap_action:
          action: toggle
      - type: button
        entity: input_boolean.confort_salon
        name: Salon
        icon: mdi:sofa
        tap_action:
          action: toggle

  # --- Mesures : température réelle, puis consigne calculée ---------------
  - type: markdown
    content: >-
      **Températures**

      {% set t = state_attr('sensor.chauffage_temperatures', 'temperatures') or {} %}
      {% set o = state_attr('sensor.chauffage_temperatures', 'origine') or {} %}
      {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
      {% for piece, mesure in t.items() %}
      - {{ cfg[piece].nom }} : **{{ mesure if mesure is not none else '?' }} °C**
      {%- if o.get(piece) == 'vannes' %} _(estimée par les vannes)_{% endif %}
      {% endfor %}

  - type: entities
    title: Chaudière
    entities:
      - entity: climate.thermostat_thermostat
        name: Lyric T6 (relais)
      - entity: sensor.chauffage_consigne_chaudiere
        name: Consigne envoyée au T6
      - entity: binary_sensor.chauffage_demande_chaudiere
        name: Demande en cours

  # --- Consignes appliquées, pour vérifier ce que fait la logique ---------
  - type: markdown
    content: >-
      **Consignes en cours**

      {# La mesure vient du capteur agrégé et non de la sonde de la pièce :
         trois pièces n'ont pas de sonde, et states() sur une entité absente
         fait échouer tout le rendu de la carte. #}
      {% set c = state_attr('sensor.chauffage_consignes', 'consignes') or {} %}
      {% set t = state_attr('sensor.chauffage_temperatures', 'temperatures') or {} %}
      {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
      {% for piece, cible in c.items() %}
      - {{ cfg.get(piece, {}).get('nom', piece) }} : **{{ cible }} °C**
      (mesure {{ t.get(piece) if t.get(piece) is not none else '?' }} °C)
      {% endfor %}

  # --- Climatisation -------------------------------------------------------
  # La chambre de Lolo n'a aucun radiateur : la clim y est l'unique source de
  # chaleur. Elle garantit une température minimale et une humidité maximale.
  - type: entities
    title: Chambre Lolo (clim seule)
    entities:
      - entity: climate.clim_chambre
        name: Climatisation
      - entity: sensor.sonoff_snzb_02d_temperature
        name: Température
      - entity: sensor.sonoff_snzb_02d_humidite
        name: Humidité
      - type: divider
      - entity: input_boolean.clim_auto_deshu
        name: Limiter l'humidité
      - entity: input_number.clim_seuil_humidite
        name: Humidité maximale
      - type: divider
      - entity: input_boolean.clim_maintien_temp_min
        name: Maintenir une température minimale
      - entity: input_number.clim_temp_min
        name: Température minimale
      - type: divider
      - entity: input_boolean.clim_pilotage_manuel
        name: Pilotage manuel en cours
      - entity: input_boolean.clim_auto_froid
        name: Rafraîchissement (optionnel)
      - entity: input_boolean.clim_auto_chaud
        name: Appoint chauffage (optionnel)

  - type: markdown
    content: >-
      **Clim — décision en cours**

      {% set o = state_attr('sensor.clim_pilotage', 'ordres') or {} %}
      {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
      {% set r = state_attr('sensor.chauffage_relais', 'relais') or {} %}
      {% for piece, ordre in o.items() %}
      - {{ cfg[piece].nom }} :
      **{{ {'cool': 'froid', 'heat': 'chaud', 'dry': 'déshumidification',
            'off': 'arrêt'}.get(ordre.mode, ordre.mode) }}**
      {%- if ordre.temp %} à {{ ordre.temp }} °C{% endif %}
      {% endfor %}

      {% if is_state('input_boolean.clim_pilotage_manuel', 'on') %}
      ✋ **Pilotage manuel** — l'automatisation reprendra la main d'elle-même.
      {% endif %}

      Garanties : au moins
      {{ states('input_number.clim_temp_min') }} °C,
      au plus {{ states('input_number.clim_seuil_humidite') }} % d'humidité ·
      Extérieur {{ states('sensor.chauffage_temperature_exterieure') }} °C

  # --- Réglages ------------------------------------------------------------
  - type: entities
    title: Réglages
    entities:
      - entity: input_select.garde_enfants
        name: Garde des enfants
      - entity: input_number.duree_confort
        name: Durée d'un appui confort
      - entity: input_number.chaudiere_consigne_marche
        name: Chaudière - consigne d'appel
      - entity: input_number.chaudiere_consigne_arret
        name: Chaudière - consigne de repos
      - entity: schedule.chauffage
        name: Horaire
      - type: divider
      - entity: input_number.clim_seuil_froid
        name: Déclenchement du froid
      - entity: input_number.clim_consigne_ete
        name: Consigne d'été
      - entity: input_number.clim_seuil_pac
        name: Extérieur mini pour l'appoint
      - entity: input_number.clim_deshu_delta
        name: Écart de chauffe pour assécher
      - entity: input_number.clim_deshu_temp_max
        name: Température max en assèchement
      - entity: input_number.clim_duree_manuel
        name: Durée de la main laissée
