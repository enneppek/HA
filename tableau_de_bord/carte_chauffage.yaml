################################################################################
# Carte "Chauffage"
#
# Pose : tableau de bord > crayon (en haut à droite) > + Ajouter une carte >
# Manuel, puis coller ce contenu (sans ce bandeau de commentaires).
################################################################################
type: vertical-stack
cards:
  - type: markdown
    content: >-
      ## Chauffage

      Semaine {{ state_attr('sensor.chauffage_consignes', 'semaine_numero') }}
      ({{ 'paire — enfants absents' if
      state_attr('sensor.chauffage_consignes', 'semaine_paire')
      else 'impaire — enfants présents' }}) ·
      {{ 'horaire actif' if
      state_attr('sensor.chauffage_consignes', 'horaire_actif')
      else 'hors horaire' }}
      {% if is_state('binary_sensor.chauffage_demande_chaudiere', 'on') %}

      🔥 **Chaudière en demande** (déficit
      {{ state_attr('binary_sensor.chauffage_demande_chaudiere', 'deficit_max') }} °C)
      {% else %}

      ⏸️ Chaudière à l'arrêt
      {% endif %}

  # --- Qui est à la maison -----------------------------------------------
  - type: grid
    columns: 3
    square: false
    cards:
      - type: button
        entity: input_boolean.presence_leo
        name: Léo
        icon: mdi:account
        tap_action:
          action: toggle
        show_state: true
      - type: button
        entity: input_boolean.presence_pablo
        name: Pablo
        icon: mdi:account
        tap_action:
          action: toggle
        show_state: true
      - type: button
        entity: input_boolean.presence_laurent
        name: Laurent
        icon: mdi:account
        tap_action:
          action: toggle
        show_state: true

  # --- Confort par pièce -------------------------------------------------
  # L'appui force la température de confort, puis s'annule tout seul au bout
  # de la durée réglée plus bas.
  - type: grid
    columns: 2
    square: false
    cards:
      - type: button
        entity: input_boolean.confort_chambre_leo
        name: Chambre Léo
        icon: mdi:bed
        tap_action:
          action: toggle
      - type: button
        entity: input_boolean.confort_chambre_pablo
        name: Chambre Pablo
        icon: mdi:bed
        tap_action:
          action: toggle
      - type: button
        entity: input_boolean.confort_sdb_enfants
        name: SdB enfants
        icon: mdi:shower
        tap_action:
          action: toggle
      - type: button
        entity: input_boolean.confort_chambre_laurent
        name: Chambre Lolo
        icon: mdi:bed
        tap_action:
          action: toggle
      - type: button
        entity: input_boolean.confort_sejour
        name: Séjour
        icon: mdi:sofa
        tap_action:
          action: toggle

  # --- Mesures : température réelle, puis consigne calculée ---------------
  - type: entities
    title: Températures
    entities:
      - entity: sensor.temperature_chambre_leo
        name: Chambre Léo
        secondary_info: last-changed
      - entity: sensor.temperature_chambre_pablo
        name: Chambre Pablo
      - entity: sensor.temperature_sdb_enfants
        name: SdB enfants
      - entity: sensor.temperature_chambre_laurent
        name: Chambre Lolo
      - entity: sensor.temperature_sejour
        name: Séjour
      - type: divider
      - entity: climate.lyric_t6
        name: Chaudière (Lyric T6)

  # --- Consignes appliquées, pour vérifier ce que fait la logique ---------
  - type: markdown
    content: >-
      **Consignes en cours**

      {% set c = state_attr('sensor.chauffage_consignes', 'consignes') or {} %}
      {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
      {% for piece, cible in c.items() %}
      - {{ cfg[piece].nom }} : **{{ cible }} °C**
      (mesure {{ states(cfg[piece].sonde) }} °C)
      {% endfor %}

  # --- Climatisation -------------------------------------------------------
  # La chambre de Lolo n'a pas de radiateur : la clim y est seule source de
  # chaleur, et assure donc aussi le hors-gel.
  - type: entities
    title: Climatisation
    entities:
      - entity: climate.clim_chambre_lolo
        name: Clim chambre Lolo
      - entity: sensor.humidite_chambre_laurent
        name: Humidité chambre Lolo
      - type: divider
      - entity: input_boolean.clim_auto_froid
        name: Rafraîchissement
      - entity: input_boolean.clim_auto_chaud
        name: Appoint chauffage
      - entity: input_boolean.clim_auto_deshu
        name: Déshumidification

  - type: markdown
    content: >-
      **Clim — décision en cours**

      {% set o = state_attr('sensor.clim_pilotage', 'ordres') or {} %}
      {% set cfg = state_attr('sensor.chauffage_configuration', 'pieces') or {} %}
      {% set r = state_attr('sensor.chauffage_relais', 'relais') or {} %}
      {% for piece, ordre in o.items() %}
      - {{ cfg[piece].nom }} :
      **{{ {'cool': 'froid', 'heat': 'chaud', 'dry': 'déshumidification',
            'off': 'arrêt'}.get(ordre.mode, ordre.mode) }}**
      {%- if ordre.temp %} à {{ ordre.temp }} °C{% endif %}
      {% endfor %}

      Extérieur : {{ states('sensor.chauffage_temperature_exterieure') }} °C ·
      Appoint rentable au-dessus de
      {{ states('input_number.clim_seuil_pac') }} °C

  # --- Réglages ------------------------------------------------------------
  - type: entities
    title: Réglages
    entities:
      - entity: input_select.garde_enfants
        name: Garde des enfants
      - entity: input_number.duree_confort
        name: Durée d'un appui confort
      - entity: schedule.chauffage
        name: Horaire
      - type: divider
      - entity: input_number.clim_seuil_froid
        name: Déclenchement du froid
      - entity: input_number.clim_consigne_ete
        name: Consigne d'été
      - entity: input_number.clim_seuil_pac
        name: Extérieur mini pour l'appoint
      - entity: input_number.clim_seuil_humidite
        name: Seuil de déshumidification
