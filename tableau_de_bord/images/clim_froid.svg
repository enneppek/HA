<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- Clim en froid : souffle frais et flocons. -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7f5ff"/>
      <stop offset="1" stop-color="#8fcaff"/>
    </linearGradient>
  </defs>
  <style>
    .voyant { animation: voyant 2s ease-in-out infinite alternate; }
    @keyframes voyant { from { opacity: 0.45; } to { opacity: 1; } }
    .flux { fill: none; stroke: #4dabf7; stroke-width: 5; stroke-linecap: round;
             stroke-dasharray: 12 14; animation: souffle 1.2s linear infinite; opacity: 0.85; }
    .f2 { animation-delay: 0.3s; } .f3 { animation-delay: 0.6s; }
    @keyframes souffle { to { stroke-dashoffset: -52; } }
    .flocon { transform-box: fill-box; transform-origin: center; opacity: 0;
              animation: neige 3s linear infinite; }
    @keyframes neige {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
      15%  { opacity: 1; }
      100% { transform: translateY(80px) rotate(180deg); opacity: 0; }
    }
  </style>
  <rect width="400" height="200" fill="url(#fond)"/>
  <path class="flux" d="M140 92 C 128 120, 152 142, 136 178"/>
  <path class="flux f2" d="M200 92 C 188 120, 212 142, 196 178"/>
  <path class="flux f3" d="M260 92 C 248 120, 272 142, 256 178"/>
  <g class="flocon" style="animation-delay:0s">
    <path d="M112 100 v16 M105 104 l14 8 M105 112 l14 -8" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g class="flocon" style="animation-delay:1.1s">
    <path d="M172 100 v16 M165 104 l14 8 M165 112 l14 -8" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g class="flocon" style="animation-delay:0.5s">
    <path d="M232 100 v16 M225 104 l14 8 M225 112 l14 -8" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g class="flocon" style="animation-delay:1.7s">
    <path d="M292 100 v16 M285 104 l14 8 M285 112 l14 -8" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <ellipse cx="200" cy="100" rx="150" ry="10" fill="#000" opacity="0.06"/>
  <rect x="70" y="30" width="260" height="64" rx="16" fill="#fdfdfd" stroke="#d6dde4" stroke-width="2"/>
  <rect x="84" y="40" width="190" height="4" rx="2" fill="#e9eef2"/>
  <rect x="95" y="80" width="210" height="7" rx="3.5" fill="#aab5bf"/>
  <circle class="voyant" cx="305" cy="50" r="5" fill="#339af0"/>
</svg>
